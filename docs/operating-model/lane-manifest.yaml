# ----------------------------------------------------------------------------
# TIERED-MERGE COUNCIL  (PI-1 master §7)
# ----------------------------------------------------------------------------
merge_council:
  # CORRECTED 2026-08-01. This block previously encoded the pre-2026-06-24
  # policy (`carson_sole_merge_tiers: [T2, T3]`), which CLAUDE.md §1.13
  # superseded when the S0-4.2d queue gate was removed from .mergify.yml.
  # Because §0.1 makes this file mandatory session reading, every session was
  # reading a merge policy the constitution had already replaced.
  #
  # Current policy: Mergify auto-merges EVERY tier once CI is green and the
  # Staging Soak Evidence Gate passes. The real gate is the evidence
  # requirement, not a human merge step.
  mergify_auto_merges: [T0, T1, T2, T3]
  gate: "Staging Soak Evidence Gate (scripts/ci/check-staging-evidence.ts) + green CI"
  members: [Tech Lead, RTE, Release Manager]
  tier_marker_label: "needs-carson-merge"   # INFORMATIONAL ONLY — not a Mergify queue gate
  high_risk_surfaces:                        # drive tier (T2/T3), not merge authority
    - migrations
    - RLS / schema
    - chain / treasury
    - credits / billing
    - anchor lifecycle
    - security
    - public API / contract
    - CLAUDE.md
  tier_detector: "scripts/ci/check-staging-evidence.ts (path-based); fails CLOSED to the HIGHEST tier (more soak evidence), never to a manual-merge requirement"
  carson_overrides: [do-not-merge, work-in-progress]   # plus final admin-merge authority at any time
  hard_rule: "Claude never runs `gh pr merge` (hook-enforced: .claude/hooks/block-pr-merge.sh). Mergify merges all tiers once green + merge-grade soak evidence."

# ----------------------------------------------------------------------------
# WIP LIMITS  (PI-1 master §4)
# ----------------------------------------------------------------------------
wip_limits:
  p0_per_lane_per_sprint: 1
  concurrent_t3_soaks_per_shared_rig: 1   # lifted by isolated-rig automation (S0-E4)

# ----------------------------------------------------------------------------
# GUARDED / SHARED SURFACES  (Sprint 0 routing header)
# ----------------------------------------------------------------------------
guarded_shared_surfaces:
  - surface: migration ledger (supabase/migrations/**)
    rule: "ONE lane runs the single migration soak per sprint; RTE assigns. Numeric NNNN prefix; never modify an existing migration."
  - surface: CLAUDE.md
    rule: "Carson-only merge (constitution / rule change). Lanes draft via PR."
  - surface: src/types/database.types.ts
    rule: "Regenerated ONLY by the sprint's migration owner."

