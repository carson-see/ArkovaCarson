  - id: L2
    name: Product & Growth
    lead: Architect
    mission: >-
      Revenue funnel + credits/billing UI, product upload/dashboards, ops/SLO +
      alerting + status page, API-key-expiry + internal-visibility dashboards,
      payment guards, MCP/webhook delivery surfaces, and the self-serve abuse floor.
    personas: [Senior Full-stack, Front-end, DBA, Architect, "API Engineer"]
    standing_ownership:
      - "src/components/**/FileUpload.tsx, BulkUploadWizard.tsx, dashboards, billing/credits + admin UI"
      - "ops/SLO + alerting + status page"
      - "API-key-expiry + internal-visibility dashboards"
      - "services/worker/src/**/paymentGuard.ts, stripe/handlers.ts, x402PaymentGate.ts"
      - "services/worker/src/**/mcp-server.ts, webhooks/delivery.ts"
      - "abuse-floor (rate/quota, dispute/chargeback->suspend, CSV/malware)"

  - id: L3
    name: Credential Network & Intelligence
    lead: Senior Full-stack
    mission: >-
      Credential Engine (CTDL/CTID + CE client), connectors (DocuSign/Drive),
      HakiChain integration, CPE/CLE, BigQuery analytics, and Nessie/Gemini extraction.
    personas: [Senior Full-stack, Front-end, DBA, "Data Scientist", "AI Eng"]
    standing_ownership:
      - "services/worker/src/**/ctdl-serializer.ts + CE client"
      - "services/worker/src/**/connectors/docusign-envelope-completed.ts, drive-changes-processor.ts"
      - "HakiChain integration"
      - "CPE/CLE"
      - "BigQuery analytics"
      - "Nessie / Gemini extraction"

