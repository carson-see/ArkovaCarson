# ----------------------------------------------------------------------------
# LANES — standing ownership (whole-PI, not sprint-specific)
# ----------------------------------------------------------------------------
lanes:
  - id: L1
    name: Trust & Chain
    lead: Architect
    mission: >-
      Bitcoin anchoring integrity, proof/Merkle correctness, chain resilience
      (kill the mempool.space SPOF), the open MIT verifier + TS/Python SDKs,
      and security / Secret-Manager / IAM hardening.
    personas: [Architect, Senior Full-stack, Front-end, DBA, "AI Eng", "Bitcoin Dev"]
    standing_ownership:
      - "services/worker/src/chain/**"
      - "services/worker/src/jobs/batch-anchor.ts (proof-persist path only)"
      - "services/worker/src/**/verify-proof.ts"
      - "services/worker/src/**/utils/merkle.ts"
      - "machines/bitcoinAnchor.machine.ts (TLA+ / PreCheck gated)"
      - "MIT verifier OSS repo + TS/Python proof-helper SDKs"
      - "security / Secret-Manager / IAM hardening (cross-lane consult)"

  - id: L2
    name: Product & Growth
    lead: Architect
    mission: >-
      Revenue funnel + credits/billing UI, product upload/dashboards, ops/SLO +
      alerting + status page, API-key-expiry + internal-visibility dashboards,
      payment guards, MCP/webhook delivery surfaces, and the self-serve abuse floor.
    personas: [Senior Full-stack, Front-end, DBA, Architect, "API Engineer"]
    standing_ownership:
      - "src/components/**/FileUpload.tsx, BulkUploadWizard.tsx, dashboards, billing/credits + admin UI"
      - "ops/SLO + alerting + status page"
      - "API-key-expiry + internal-visibility dashboards"
      - "services/worker/src/**/paymentGuard.ts, stripe/handlers.ts, x402PaymentGate.ts"
      - "services/worker/src/**/mcp-server.ts, webhooks/delivery.ts"
      - "abuse-floor (rate/quota, dispute/chargeback->suspend, CSV/malware)"

  - id: L3
    name: Credential Network & Intelligence
    lead: Senior Full-stack
    mission: >-
      Credential Engine (CTDL/CTID + CE client), connectors (DocuSign/Drive),
      HakiChain integration, CPE/CLE, BigQuery analytics, and Nessie/Gemini extraction.
    personas: [Senior Full-stack, Front-end, DBA, "Data Scientist", "AI Eng"]
    standing_ownership:
      - "services/worker/src/**/ctdl-serializer.ts + CE client"
      - "services/worker/src/**/connectors/docusign-envelope-completed.ts, drive-changes-processor.ts"
      - "HakiChain integration"
      - "CPE/CLE"
      - "BigQuery analytics"
      - "Nessie / Gemini extraction"

# ----------------------------------------------------------------------------
# TRAIN ROLES — operated by the session under Carson's oversight
# ----------------------------------------------------------------------------
train_roles:
  - id: RTE
    name: Release Train Engineer
    owns: [soak serialization, isolated-rig assignment, milestone/tier hygiene, gate tracker]
  - id: SCRUM_PLANNING
    name: Scrum / Planning
    owns: [source-of-truth reconciliation, Jira/Confluence currency, backlog filing]
  - id: TECH_LEAD
    name: Tech Lead (CTO)
    owns: [architecture review, CLAUDE.md v-next authorship, T0/T1 merge council seat]
  - id: RELEASE_MANAGER
    name: Release Manager
    owns: [release pipeline, Mergify/stacked-PR playbook, deploy gates, T0/T1 council seat]
  - id: DBA
    name: Database Admin (shared)
    owns: [migration ledger integrity, ledger CI audit, database.types.ts regeneration]
  - id: BUSINESS_STAKEHOLDER
    name: Business Stakeholder (Sprint-0 contributor)
    owns: [external-partnership gates (CE/Haki), key custody kickoff]

# ----------------------------------------------------------------------------
# TIERED-MERGE COUNCIL  (PI-1 master §7)
# ----------------------------------------------------------------------------
merge_council:
  delegated_tiers: [T0, T1]
  members: [Tech Lead, RTE, Release Manager]
  carson_sole_merge_tiers: [T2, T3]
  carson_sole_merge_surfaces:
    - migrations
    - RLS / schema
    - chain / treasury
    - credits / billing
    - anchor lifecycle
    - security
    - public API / contract
    - CLAUDE.md
  tier_detector: "scripts/ci/check-staging-evidence.ts (path-based); fails CLOSED to 'needs Carson'"
  hard_rule: "Claude never merges to main. Routine CI-green T0/T1 auto-merge via Mergify; T2/T3 are Carson's."

# ----------------------------------------------------------------------------
# WIP LIMITS  (PI-1 master §4)
# ----------------------------------------------------------------------------
wip_limits:
  p0_per_lane_per_sprint: 1
  concurrent_t3_soaks_per_shared_rig: 1   # lifted by isolated-rig automation (S0-E4)

# ----------------------------------------------------------------------------
# GUARDED / SHARED SURFACES  (Sprint 0 routing header)
# ----------------------------------------------------------------------------
guarded_shared_surfaces:
  - surface: migration ledger (supabase/migrations/**)
    rule: "ONE lane runs the single migration soak per sprint; RTE assigns. Numeric NNNN prefix; never modify an existing migration."
  - surface: CLAUDE.md
    rule: "Carson-only merge (constitution / rule change). Lanes draft via PR."
  - surface: src/types/database.types.ts
    rule: "Regenerated ONLY by the sprint's migration owner."

