    standing_ownership:
      - "services/worker/src/chain/**"
      - "services/worker/src/jobs/batch-anchor.ts (proof-persist path only)"
      - "services/worker/src/**/verify-proof.ts"
      - "services/worker/src/**/utils/merkle.ts"
