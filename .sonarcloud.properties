# SonarCloud Configuration
# Exclude auto-generated files and immutable migrations from analysis.
#
# Per CLAUDE.md §1.2 migrations are immutable; analyzing them for code-smell /
# duplication / reliability is meaningless because we cannot edit them anyway.
# The Path C baseline (00000000000000_baseline_at_main_HEAD.sql) is a pg_dump
# snapshot of prod's schema and inherently has high lexical duplication
# (repeated CREATE TABLE / ADD CONSTRAINT / GRANT patterns).

# Full exclusions: SonarCloud will not analyze generated types, the immutable
# pg_dump baseline, or the archived historical SQL chain. Future active
# migrations remain visible to normal analysis.
sonar.exclusions=**/database.types.ts,supabase/migrations/00000000000000_baseline_at_main_HEAD.sql,docs/migrations-archive/**

# Belt-and-suspenders: also exclude from CPD (copy-paste detector).
# Golden-dataset corpus files are hand-curated eval DATA, not code: dozens of
# similarly-shaped entries (same ground-truth field set per profession) give
# them inherently high lexical duplication that is meaningless as a code smell —
# the same rationale that already exempts golden-dataset-professional-education.ts.
# The three S3.3 held-out wave-1 corpus files and the Wave 2 top-15 01-05
# tranche are the same class. Keep this list exact: support code and future
# tranches remain under CPD analysis.
# `src/types/opsSlo.ts` is a types-only worker<->frontend contract MIRROR
# (SCRUM-2401): the two build roots (`src/` and `services/worker/src/`) have
# separate tsconfig rootDirs and cannot share a module, so the response
# interfaces are duplicated by design — same rationale as `database.types.ts`.
# Only the pure-types file is excluded; the hook's fetch logic + the worker
# handler stay under full CPD.
sonar.cpd.exclusions=**/database.types.ts,src/types/opsSlo.ts,supabase/migrations/**,docs/migrations-archive/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,e2e/**,src/tests/**,services/worker/src/ai/eval/golden-dataset-professional-education.ts,services/worker/src/ai/eval/golden-dataset-s33-licensing-heldout.ts,services/worker/src/ai/eval/golden-dataset-s33-au-ke-heldout.ts,services/worker/src/ai/eval/golden-dataset-s33-ood-negatives.ts,services/worker/src/ai/eval/golden-dataset-s33-wave2-top15-01-05-heldout.ts

# And from coverage analysis (no test coverage measured against migrations).
sonar.coverage.exclusions=**/database.types.ts,supabase/migrations/**,docs/migrations-archive/**

# Also skip a specific PL/SQL rule that would still flag if the above were
# bypassed somehow.
sonar.issue.ignore.multicriteria=m1
sonar.issue.ignore.multicriteria.m1.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.m1.resourceKey=supabase/migrations/**
