# SonarCloud Configuration
#
# =============================================================================
# ANALYSIS METHOD: Automatic Analysis (autoscan) — NOT a CI scanner.
# =============================================================================
# Verified 2026-08-01 against the SonarCloud API:
#   - project setting `sonar.autoscan.enabled = true`
#   - every Compute Engine task has no `submitterLogin` (SonarCloud's own
#     GitHub App submits them, not a CI job)
#   - no workflow in `.github/workflows/` invokes `sonar-scanner`, the
#     `sonarqube-scan-action`, or the `sonarcloud-github-action`. The only
#     Sonar-related CI job (`sonar-quality-gate-config` in ci.yml) is a
#     read-only REST poll of the gate CONFIG; it never submits an analysis.
#
# CONSEQUENCE — this is the ONLY properties file SonarCloud reads.
# Automatic Analysis reads `.sonarcloud.properties`. It does NOT read
# `sonar-project.properties` (that filename belongs to the CI scanner), and it
# honors only a restricted subset of scanner properties.
#
# `sonar-project.properties` was deleted on 2026-08-01. It had accumulated five
# `sonar.issue.ignore.multicriteria` entries plus its own `sonar.exclusions` and
# lcov paths, all of which were inert — SonarCloud never read that file. Its
# comments asserted suppressions that were not in effect, which repeatedly
# misled engineers into believing findings were already triaged. Do not
# recreate it unless the project moves to CI-based analysis (FOLLOW-UPS below).
#
# -----------------------------------------------------------------------------
# WHAT AUTOMATIC ANALYSIS DOES NOT SUPPORT (do not re-add these here)
# -----------------------------------------------------------------------------
# `sonar.issue.ignore.multicriteria` — NOT honored. Proven empirically on this
#   project: an `m1` entry ignoring `plsql:NullComparison` on
#   `supabase/migrations/**` was present in THIS file from 2026-03-11, yet nine
#   such issues were raised on that exact path (created 2026-03-11 through
#   2026-04-26) across eight subsequent main-branch analyses. The entry was
#   removed on 2026-08-01. To suppress a finding the exclusion properties below
#   cannot express, resolve it in the SonarCloud UI as False Positive / Won't
#   Fix — that is the only mechanism autoscan respects.
#
# `sonar.typescript.lcov.reportPaths` / `sonar.javascript.lcov.reportPaths` —
#   NOT honored. Automatic Analysis does not run tests and imports no coverage
#   report. `coverage` and `new_coverage` have never held a value on this
#   project. The "Coverage on New Code >= 80" condition IS defined on the Sonar
#   way gate (and `scripts/ci/check-sonar-quality-gate.ts` asserts it stays
#   defined), but it cannot fire without an imported report. Coverage is
#   actually enforced by the per-file vitest thresholds in `vitest.config.ts`
#   and `services/worker/vitest.config.ts` — that is the real control behind
#   CLAUDE.md §1.7, not the Sonar gate.
#
# -----------------------------------------------------------------------------
# FOLLOW-UPS (not fixed by this file)
# -----------------------------------------------------------------------------
# 1. Main-branch analysis has been dead since 2026-05-06. Every Compute Engine
#    task since then is a pull-request analysis; no `branch=main` analysis has
#    run and none have failed — they are simply not being submitted. All
#    main-branch issue counts and the main `alert_status` are a stale
#    2026-05-06 snapshot. The exclusions below take effect only once main
#    analysis is restored; they have never been exercised by a main analysis,
#    so verify them against the API after the first successful run.
# 2. SonarCloud project visibility is `public` while the GitHub repository is
#    private, so project source is anonymously readable.
# Both are operator actions in the SonarCloud UI.

# -----------------------------------------------------------------------------
# EXCLUSIONS
# -----------------------------------------------------------------------------
# Per CLAUDE.md §1.2 migrations are immutable ("never modify an existing
# migration — write a compensating one"), so findings on them are unactionable
# by construction. They are also analyzed under the WRONG DIALECT: SonarCloud
# routes `.sql` to the Oracle PL/SQL analyzer (the language distribution shows
# plsql=19,560 ncloc and no `postgres` language), applying Oracle semantics to
# PostgreSQL DDL. That combination produced all 379 open plsql findings on
# `supabase/migrations/**` as of the last main analysis (309 plsql:S1192, 30
# LiteralsNonPrintableCharacters, 15 S125, 9 NullComparison, 16 across seven
# other rules).
#
# Excluding the directory retires that whole class instead of suppressing rules
# one at a time, and prevents every future migration from regenerating it.
# Security coverage is unaffected: secrets are scanned by
# `.github/workflows/gitleaks.yml`, RLS by `src/tests/rls/`, and schema drift by
# `.github/workflows/migration-drift.yml`.
#
# `supabase/migrations/**` subsumes the Path C pg_dump baseline
# (00000000000000_baseline_at_main_HEAD.sql) that was listed here individually.
# `docs/migrations-archive/**` is the retired historical SQL chain.
# `**/database.types.ts` is generated by `supabase gen types`.
#
# The last three entries are carried over from the deleted
# `sonar-project.properties`, which declared them but never applied them (that
# file was never read — see the header). They are re-declared HERE so the
# intent survives in the file autoscan actually consumes:
#   - `supabase/seed.sql` + `scripts/strip-demo-seed.sql` are local-dev seed
#     data. seed.sql carries 4 open `secrets:S8215` findings that are the
#     publicly documented Supabase local-dev JWTs — `.gitleaks.toml` already
#     allowlists the exact same strings as "NOT real secrets ... they only work
#     with the local dev instance". Excluding the file keeps that one ruling in
#     two places instead of leaving 4 permanent unexplained secret findings.
#   - `**/fraud-training-seed.ts` is hand-curated eval DATA, not code (same
#     class as the golden-dataset corpora in sonar.cpd.exclusions below).
#
# `packages/sdk/examples/**` is published SDK example code — scripts whose
# entire job is to take a path from the user on the command line and anchor it.
# `tssecurity:S8707` ("Agentic workflows should not be vulnerable to path
# injection") models `process.argv` as LLM-controlled, so it fires on every
# example of that shape, and its ONLY compliant form is confining the path to a
# base directory. That confinement is not acceptable here: these files ship
# inside the npm tarball (`files: ["dist", "examples", ...]`), and a cwd jail
# makes the ordinary `tsx anchor-document.ts /Users/me/contract.pdf` throw. One
# was added on 2026-08-01, found to break first-run usage in review, and
# removed on 2026-08-02 — see the S8707 entry under KNOWN FALSE POSITIVES.
# There is no trust boundary between a user and the argv of a CLI they invoked
# themselves, so the rule is structurally inapplicable to this directory rather
# than wrong about any one line. Excluding the directory retires the class
# instead of re-litigating it per example.
# Compensating controls are unchanged: examples are typechecked (`tsc --noEmit`
# in packages/sdk) and linted, and secrets are scanned repo-wide by
# `.github/workflows/gitleaks.yml`, which is path-independent of this file.
# Scope note: `packages/sdk/src/**` — the actual published runtime — stays under
# full analysis. Only the hand-run demo scripts are excluded.
sonar.exclusions=**/database.types.ts,supabase/migrations/**,docs/migrations-archive/**,supabase/seed.sql,scripts/strip-demo-seed.sql,**/fraud-training-seed.ts,packages/sdk/examples/**

# Belt-and-suspenders: also exclude from CPD (copy-paste detector).
# Golden-dataset corpus files are hand-curated eval DATA, not code: dozens of
# similarly-shaped entries (same ground-truth field set per profession) give
# them inherently high lexical duplication that is meaningless as a code smell —
# the same rationale that already exempts golden-dataset-professional-education.ts.
# The three S3.3 held-out wave-1 corpus files and the three planned Wave 2
# tranche sources are the same class. Keep this list exact: support code and
# all similarly named files remain under CPD analysis.
# `src/types/opsSlo.ts` is a types-only worker<->frontend contract MIRROR
# (SCRUM-2401): the two build roots (`src/` and `services/worker/src/`) have
# separate tsconfig rootDirs and cannot share a module, so the response
# interfaces are duplicated by design — same rationale as `database.types.ts`.
# Only the pure-types file is excluded; the hook's fetch logic + the worker
# handler stay under full CPD.
# `services/worker/src/ai/nessie-json-parse.ts` and `.../ai/together.ts` are
# deliberate file-scoped ports of gemini.ts's private parseModelJson (see PRs
# #1660 / #1661): the model-JSON extraction logic cannot be shared across those
# provider modules without a pre-release DRY refactor of gemini.ts that is too
# risky to run now. CPD flags the intentional duplication. SonarCloud Automatic
# Analysis only honors cpd exclusions committed to `main` (branch-side edits are
# ignored), so the exemption must live here.
sonar.cpd.exclusions=**/database.types.ts,src/types/opsSlo.ts,supabase/migrations/**,docs/migrations-archive/**,supabase/seed.sql,scripts/strip-demo-seed.sql,**/fraud-training-seed.ts,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,e2e/**,src/tests/**,tests/**,services/worker/src/ai/eval/golden-dataset-professional-education.ts,services/worker/src/ai/eval/golden-dataset-s33-licensing-heldout.ts,services/worker/src/ai/eval/golden-dataset-s33-au-ke-heldout.ts,services/worker/src/ai/eval/golden-dataset-s33-ood-negatives.ts,services/worker/src/ai/eval/golden-dataset-s33-wave2-top15-01-05-heldout.ts,services/worker/src/ai/eval/golden-dataset-s33-wave2-top15-06-10-heldout.ts,services/worker/src/ai/eval/golden-dataset-s33-wave2-top15-11-15-heldout.ts,services/worker/src/ai/nessie-json-parse.ts,services/worker/src/ai/together.ts

# And from coverage analysis (no test coverage measured against migrations).
sonar.coverage.exclusions=**/database.types.ts,supabase/migrations/**,docs/migrations-archive/**

# -----------------------------------------------------------------------------
# QUALITY-GATE CONTRACT (documentation for scripts/ci/check-sonar-quality-gate.ts)
# -----------------------------------------------------------------------------
# The gate itself lives in the SonarCloud UI, not in git. These lines are the
# written contract that `check-sonar-quality-gate.ts` asserts the live gate
# still satisfies — its header and its failure message both point HERE, so the
# thresholds must be readable in this file. Carried over from the deleted
# `sonar-project.properties`; changing a number here without changing the
# `REQUIRED` array in that script (or vice versa) is the drift the gate exists
# to catch.
#
# Locked conditions on the "Sonar way" gate:
#   new_coverage                  >= 80  (see the coverage caveat in the header:
#                                         defined and asserted, but it cannot
#                                         fire while autoscan imports no report)
#   new_duplicated_lines_density  <= 3
#   new_security_rating           == A (1)
#   new_reliability_rating        == A (1)
#   new_maintainability_rating    == A (1)
#   new_security_hotspots_reviewed == 100
sonar.coverage.minimum.new=80
sonar.duplications.maximum.new=3

# -----------------------------------------------------------------------------
# KNOWN FALSE POSITIVES — resolve these in the SonarCloud UI, not here.
# -----------------------------------------------------------------------------
# The rationale stays in the repo so the UI resolutions are auditable, but the
# suppression itself MUST be applied as a False Positive resolution in
# SonarCloud: `sonar.issue.ignore.multicriteria` does not work under autoscan
# (see the header). These previously lived — inertly — in the deleted
# `sonar-project.properties`, where they suppressed nothing.
#
# SCRUM-1286 / SCRUM-1976 — `services/worker/src/api/v2/search.ts`
#   rules typescript:S5334, typescript:S2077
#   search.ts builds PostgREST `.or()` filter strings from user input that
#   passes through `sanitizeFilterValue()`, which escapes all PostgREST grammar
#   characters. Taint analysis flags this as database injection because it
#   cannot track the custom sanitizer. The path is
#   user q -> sanitizeFilterValue -> template -> .or(). This is the standard
#   Supabase PostgREST pattern, not raw SQL.
#
# SCRUM-1304 — `scripts/ci/check-sonar-quality-gate.ts`
#   rules tssecurity:S8476, tssecurity:S5145
#   The script only ever reads SonarCloud's own API (auth'd via
#   SONARCLOUD_TOKEN); the data is not user-controlled. Taint analysis flags the
#   parsed JSON flowing into URL construction (S8476) and log output (S5145),
#   but the data path is API -> script stdout -> CI log only.
#
# PR #1785 (2026-08-02) — `packages/sdk/examples/anchor-document.ts`
#   rule tssecurity:S8707 ("Agentic workflows should not be vulnerable to path
#   injection"), 2 findings: the `stat()` and `readFile()` calls, both fed from
#   `process.argv`, which the rule models as an LLM-controlled source.
#   This one is handled by `sonar.exclusions` above, NOT by a UI resolution —
#   it is listed here because this is where the reasoning belongs, and because
#   the exclusion needs to be understood as a standing ruling on the directory
#   rather than a one-off.
#   Why it is a false positive: the example is a hand-run CLI. Its argument is
#   argv supplied by the person who typed the command, so there is no trust
#   boundary to enforce; confining the path protects nobody and breaks the
#   ordinary `anchor-document.ts /Users/me/contract.pdf` invocation for every
#   consumer who copies the file out of the npm tarball.
#   Why it is not coded around: S8707's only compliant shape is confinement to
#   a base directory (its own "how to fix" is a `realpathSync` + `startsWith`
#   cwd jail). There is no sanitizer the rule recognises that still permits an
#   absolute path, so satisfying it and keeping the example usable are mutually
#   exclusive. Verified empirically on this PR: at 221ff3b98 (no jail) the
#   SonarCloud check reported "Quality Gate failed — C Security Rating on New
#   Code (required >= A)" off these 2 findings; at 4184166 (jail restored) both
#   were closed as FIXED and the gate passed. The jail was the thing to remove,
#   so the finding is dispositioned here instead.
