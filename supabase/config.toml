# Supabase configuration for Arkova
# See: https://supabase.com/docs/guides/cli/config

project_id = "arkova"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback", "https://app.arkova.ai/auth/callback", "https://arkova-26.vercel.app/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# SCRUM-5145: confirmation links remain valid for 15 minutes and Auth enforces
# the same 90-second resend boundary shown by the signup UI.
otp_expiry = 900
max_frequency = "90s"
# SCRUM-2907: prod REQUIRES email confirmation. The previous comment here
# claimed prod auto-confirms and turned this off to match — that claim was
# false, and it pointed local/CI at the opposite of production.
#
# Verified live against prod (project vzwyaatejekddvltxyye) on 2026-08-01:
#   POST /auth/v1/signup -> HTTP 200, body carries confirmation_sent_at and
#   NO session; auth log records action=user_confirmation_requested; the user
#   row lands with email_confirmed_at = NULL. Following the emailed token
#   through GET /auth/v1/verify?type=signup returns 303 to
#   https://app.arkova.ai#access_token=... and sets email_confirmed_at.
#
# Keep this ON so local/CI exercise the same confirmation-pending path real
# users hit. The E2E signup spec asserts that path.
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your Arkova account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Arkova password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your Arkova sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.sms]
enable_signup = false
enable_confirmations = false


# Multi-factor authentication (SCRUM-3167). The Supabase CLI default is enroll_enabled=false /
# verify_enabled=false, so the local + CI stack (`supabase start`) could not exercise TOTP at all.
# This mirrors the production project setting and lets the Playwright MFA specs run in CI.
# `enroll_enabled` requires `verify_enabled` (CLI validation).
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# UAT-04 composes mailbox confirmation with mandatory MFA in one token hook.
# Hosted projects must explicitly enable the same hook during rollout; SQL
# installation alone does not change hosted Auth configuration.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/private/oauth_email_confirmation_token_hook"

[analytics]
enabled = false
port = 54327
backend = "postgres"
