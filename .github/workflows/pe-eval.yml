# Professional-Education live eval gate runner (SCRUM-2188 / SCRUM-1854).
#
# Runs the PE merge-gate harness against the tuned Vertex golden-v* endpoint using
# real ADC supplied by Workload Identity Federation (the local CLI path needs an
# interactive `gcloud auth application-default login`, which CI avoids — the
# metadata/WIF credential is consumed directly by google-auth-library).
#
# workflow_dispatch only. The job fails (exit 1) if any requested gate is below
# its minimum F1, so a green run IS the gate-pass evidence. The report (md+json)
# is uploaded as an artifact regardless of pass/fail.
#
# Gate fixtures only — this runs the merge-gate harness, which scores the curated
# gate fixtures. The held-out TEST split is exercised by a separate runner and is
# never wired into a gate (a gate scored on the held-out set stops being a
# generalization signal). Vertex cost discipline (§7): tear the model down the
# moment the run completes.
name: PE Eval (live gemini gate)

on:
  workflow_dispatch:
    inputs:
      gates:
        description: 'Comma-separated gate IDs (e.g. SCRUM-1962 CPE, SCRUM-1963 CLE, SCRUM-2187 course-id)'
        required: true
        default: 'SCRUM-1962'
      endpoint:
        description: 'Vertex tuned-model endpoint resource for GEMINI_TUNED_MODEL'
        required: true
        default: 'projects/arkova1/locations/us-central1/endpoints/8811908947217743872'

concurrency:
  group: pe-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pe-eval:
    name: PE live gate eval
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/worker/package-lock.json

      - name: Install worker dependencies
        working-directory: services/worker
        run: npm ci --ignore-scripts

      - name: Authenticate to Google Cloud (WIF → ADC)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Run PE gate eval against tuned golden-v5
        working-directory: services/worker
        env:
          # Inputs pass through env (never interpolated into the shell command)
          # to avoid ${{ }} script-injection.
          GEMINI_TUNED_MODEL: ${{ inputs.endpoint }}
          PE_GATES: ${{ inputs.gates }}
          # Required: the live (non-mock) harness path hard-errors without this
          # (run-pe-gates.ts + gemini.ts gate on ENABLE_AI_EXTRACTION; it defaults
          # false off-prod per §1.6). This is an out-of-band eval, not prod traffic.
          ENABLE_AI_EXTRACTION: 'true'
          # The tuned-endpoint path authenticates via ADC (WIF), so the real
          # Gemini API key is never used here — GEMINI_API_KEY is only a
          # GeminiProvider constructor formality (see SCRUM-2211). A placeholder
          # avoids granting the CI SA secretmanager access for a value the tuned
          # eval doesn't consume.
          GEMINI_API_KEY: 'unused-tuned-endpoint-eval'
          # loadConfig() validates the whole worker env at import. This eval only
          # calls the tuned Vertex endpoint (via ADC) and never touches Supabase or
          # Stripe, so these are schema-satisfying placeholders, not real creds.
          SUPABASE_URL: 'https://placeholder.supabase.co'
          SUPABASE_SERVICE_ROLE_KEY: 'placeholder-not-used-in-eval'
          STRIPE_SECRET_KEY: 'sk_test_placeholder_not_used_in_eval'
          STRIPE_WEBHOOK_SECRET: 'whsec_placeholder_not_used_in_eval'
        run: |
          npx tsx src/ai/eval/run-pe-gates.ts \
            --provider gemini \
            --gates "${PE_GATES}" \
            --output docs/eval/

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pe-gate-eval-report
          path: services/worker/docs/eval/pe-gates-gemini-*
          if-no-files-found: warn
          retention-days: 14
