name: Staging Soak Evidence

# Required PR-only gate. CLAUDE.md §1.11 / §1.12.
#
# Validates that prod-affecting PRs declare a risk tier in the PR body and
# provide the evidence fields appropriate for that tier. T0 docs/tests/CI/
# tooling-only PRs run CI only. Path-based detector blocks under-declaration
# (e.g. PR touches services/worker/src/chain/ but declares T1).
#
# No override label — the `staging-soak-skip` label was destroyed 2026-05-07.
# The only CI-only path is T0 inside scripts/ci/check-staging-evidence.ts.
# Every other prod-bound PR must produce real evidence; T1 expedited evidence
# still requires exact head SHA, health/smoke, rollback, rationale, and approval.
#
# ⚠️ TEMPORARY EXCEPTION TO THE PARAGRAPH ABOVE (founder directive 2026-08-01):
# the repository variable `SOAK_GATE_DISABLED` (threaded to the check step at
# the bottom of this file) short-circuits the whole gate to a pass while it is
# the literal string "true". It is still not a *label* and still not anything a
# PR author can set — but while it is set, "every other prod-bound PR must
# produce real evidence" is NOT live behaviour. It stops being honored after
# 2026-08-16T00:00:00Z regardless of the variable. Re-enable with:
#   gh variable set SOAK_GATE_DISABLED --body false
#
# SCRUM-3026 (2026-07-28) — live-state fix: `github.sha` and
# `github.event.pull_request.*` are FROZEN at the moment the triggering event
# was delivered. A bare re-run of an already-created job (GitHub UI "Re-run
# jobs", `gh run rerun`, a branch-protection re-request, or any re-check that
# doesn't create a brand-new webhook delivery) replays that frozen snapshot
# untouched — a PR body edit made afterward, or a base that has moved because
# other PRs merged in the same wave (07-27 10-PR wave), is invisible to the
# rerun. That voided RC-manifest base coverage and made post-event body edits
# never reach the gate. Fix: resolve PR head/base/body LIVE via `gh api` at
# job-run time (same pattern as the labels-live-read fix already in
# scripts/ci/lib/ciContext.ts's `fetchLiveLabels`/`resolvePrLabels`) and check
# out the live-resolved merge-preview SHA instead of the frozen `github.sha`
# value, so a stale rerun still evaluates CURRENT PR state. This does not
# loosen any evidence requirement — it only makes the inputs to those
# requirements current. See docs/runbooks/ci/mint-fresh-event.md for the
# sanctioned way to force a genuinely fresh event end-to-end (new commit +
# push, optional PR-body head-SHA bump) instead of relying on an opaque rerun.

on:
  pull_request:
    # 2026-09-12 cost-reduction sweep: dropped `labeled`/`unlabeled` — a
    # label add/remove is pure metadata with no evidence-relevant change.
    # `edited` is KEPT: the PR body IS this gate's evidence input, so a
    # body-only fix (e.g. correcting a Soak start/end typo) must re-run the
    # gate. The existing job-level `if:` below already skips Mergify's own
    # speculative status-edit re-writes of that body.
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main, staging, develop]
    paths-ignore:
      - "LICENSE"
      - ".gitignore"
      - "README.md"
      - "memory/**.md"

# SCRUM-4565: Mergify edits its speculative PR body as required checks change.
# Those body-only updates are metadata, not new source/evidence. Give them a
# separate cancellation group AND a different skipped job name below: they
# must neither cancel a source check nor replace its success/failure status.
# Real source/base changes and all ordinary PR evidence edits still run.
concurrency:
  group: staging-evidence-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && github.event.changes.body && github.event.changes.base == null && startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.user.login == 'mergify[bot]' && github.event.sender.login == 'mergify[bot]' && 'status-edit' || (github.event.pull_request.draft && !(startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.user.login == 'mergify[bot]') && 'draft' || 'gate') }}
  cancel-in-progress: true

jobs:
  staging-evidence:
    # Ordinary event-time drafts have not requested admission. Skip at the job
    # boundary so GitHub allocates no runner (even a five-second runner job is
    # billed as a full minute). The distinct job name below prevents this
    # skipped draft status from impersonating the required ready-state gate.
    # A genuine Mergify speculative draft retains its existing policy path.
    # Missing/malformed draft context admits the job and fails closed inside.
    if: ${{ !(github.event.action == 'edited' && github.event.changes.body && github.event.changes.base == null && startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.user.login == 'mergify[bot]' && github.event.sender.login == 'mergify[bot]') && (!github.event.pull_request.draft || (startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.user.login == 'mergify[bot]')) }}
    name: ${{ github.event.action == 'edited' && github.event.changes.body && github.event.changes.base == null && startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.user.login == 'mergify[bot]' && github.event.sender.login == 'mergify[bot]' && 'Staging evidence status edit' || (github.event.pull_request.draft && !(startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.user.login == 'mergify[bot]') && 'Staging evidence deferred (Draft)' || 'Staging Soak Evidence Gate') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      # PR_LABELS is a seed only — scripts/ci/lib/ciContext.ts's
      # resolvePrLabels() unions this with a LIVE `gh api` fetch at read time
      # (fetchLiveLabels), so a label added after this frozen payload was
      # captured is still honored on a bare rerun.
      PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
      # That live union only actually happens with a token in the env: `gh`
      # authenticates from GH_TOKEN / GITHUB_TOKEN and nothing else (the
      # `pull-requests: read` permission above scopes a token, it does not
      # supply one). The "Resolve live PR state" step below sets GH_TOKEN for
      # itself, but a STEP-scoped value does not reach the tsx check step — so
      # before this line the fetch threw on every run and was swallowed to `[]`.
      # PR_NUMBER is set right here, so fetchLiveLabels() always had a PR
      # context and always attempted (and failed) the call.
      #
      # check-staging-evidence.ts reads no label today, but it imports
      # ciContext, whose module-level `resolvePrLabels()` performs the fetch
      # regardless — so this both removes a guaranteed-failing subprocess and
      # makes the job correct in advance of the first label gate added here.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Mergify merge queue creates speculative draft PRs (branch mergify/merge-queue/*)
      # whose body doesn't carry the original PR's staging evidence section.
      # The original PR already passed this gate before entering the queue,
      # so re-checking the speculative merge is redundant and always fails.
      # SCRUM-3812: the skip requires BOTH the branch prefix AND the
      # mergify[bot] PR author. `github.head_ref` alone is author-controlled —
      # a PR opened from a branch literally named `mergify/merge-queue/<x>`
      # skipped every step below and still posted SUCCESS, greening this
      # required gate without the checker ever running. The PR author is
      # assigned by GitHub and immutable (unlike `github.actor`, which becomes
      # the human on a re-run and would deadlock a genuine queue PR), so only
      # real Mergify speculative PRs skip.
      - name: Skip for Mergify merge queue
        if: startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.user.login == 'mergify[bot]'
        run: |
          echo "Mergify merge queue speculative check — skipping staging evidence gate."
          echo "The original PR passed this gate before entering the queue."

      # SCRUM-3026: resolve the PR's CURRENT head SHA, base SHA, merge-preview
      # SHA, and body via the GitHub API — never the frozen event payload.
      # Runs on every execution of this job, including a bare rerun of an old
      # run, so staleness cannot survive a re-check. Fails CLOSED: an
      # unresolvable head/base SHA stops the job rather than silently
      # evaluating against an unknown state.
      - name: Resolve live PR state
        id: live_pr
        if: "!(startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.user.login == 'mergify[bot]')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [[ -z "${PR_NUMBER}" ]]; then
            echo "::error::No pull_request.number in event context; cannot resolve live PR state."
            exit 1
          fi
          DATA="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}")"
          # Ordinary draft PRs have not requested admission yet. Resolve this
          # from the live API so a frozen rerun cannot mistake a later
          # ready/draft transition. Missing or malformed draft state evaluates
          # fully (fail closed); only the literal boolean true defers work.
          IS_DRAFT="$(jq -r 'if (.draft | type) == "boolean" then (.draft | tostring) else "unknown" end' <<<"${DATA}")"
          EVENT_DRAFT="${{ github.event.pull_request.draft }}"
          # Event-time draft runs always stay in the cheap, distinct draft
          # bucket. If the PR is Ready now, its fresh ready_for_review event
          # owns the required gate; this stale draft run must not duplicate or
          # cancel it.
          if [[ "${EVENT_DRAFT}" == "true" ]]; then
            echo "evaluate=false" >> "${GITHUB_OUTPUT}"
            echo "is_draft=${IS_DRAFT}" >> "${GITHUB_OUTPUT}"
            if [[ "${IS_DRAFT}" == "false" ]]; then
              echo "::notice::This frozen draft event now resolves to a Ready PR. Deferring this stale run; the fresh ready_for_review event owns the required Staging Soak Evidence Gate."
            else
              echo "::notice::Staging evidence evaluation deferred for this ordinary draft event. Mark Ready for review to mint a fresh full gate check."
            fi
            exit 0
          fi
          if [[ "${IS_DRAFT}" == "true" ]]; then
            echo "::error::Live PR #${PR_NUMBER} is Draft, but this frozen event would publish the required Staging Soak Evidence Gate name. Refusing to reuse that required status; wait for the converted_to_draft or ready_for_review event."
            exit 1
          fi
          echo "evaluate=true" >> "${GITHUB_OUTPUT}"
          echo "is_draft=${IS_DRAFT}" >> "${GITHUB_OUTPUT}"
          HEAD_SHA="$(jq -r '.head.sha // empty' <<<"${DATA}")"
          # `.base.sha` on the pull-request resource is a cached field. GitHub
          # can leave it behind the repository ref after main advances (seen
          # on #2979/#2991/#2995 on 2026-09-19). Resolve the target ref itself;
          # the repository/ref names still come from GitHub's authenticated PR
          # record, and this workflow only accepts this repository's allowed
          # base branches.
          BASE_REPO="$(jq -r '.base.repo.full_name // empty' <<<"${DATA}")"
          BASE_REF="$(jq -r '.base.ref // empty' <<<"${DATA}")"
          if [[ "${BASE_REPO}" != "${{ github.repository }}" ]]; then
            echo "::error::PR #${PR_NUMBER} targets unexpected base repository '${BASE_REPO}'."
            exit 1
          fi
          if [[ ! "${BASE_REF}" =~ ^(main|staging|develop)$ ]]; then
            echo "::error::PR #${PR_NUMBER} targets unexpected base ref '${BASE_REF}'."
            exit 1
          fi
          BASE_DATA="$(gh api "repos/${BASE_REPO}/git/ref/heads/${BASE_REF}")"
          BASE_SHA="$(jq -r '.object.sha // empty' <<<"${BASE_DATA}")"
          # SCRUM-3481: the PR author's login, so the evidence check can reject
          # a residual-risk note whose `Approved by:` names the author. Read
          # from the live API alongside the SHAs, never from the PR body — it
          # must not be author-controlled. A GitHub login is
          # `[A-Za-z0-9-]{1,39}`, so no shell-metacharacter sanitising is
          # needed beyond pinning it to that shape; anything else is dropped.
          AUTHOR_LOGIN="$(jq -r '.user.login // empty' <<<"${DATA}")"
          if [[ ! "${AUTHOR_LOGIN}" =~ ^[A-Za-z0-9-]{1,39}$ ]]; then
            echo "::warning::PR #${PR_NUMBER} author login did not match the expected GitHub login shape — the approver-vs-author cross-check will be skipped for this run."
            AUTHOR_LOGIN=""
          fi
          MERGE_SHA="$(jq -r '.merge_commit_sha // empty' <<<"${DATA}")"
          MERGEABLE_STATE="$(jq -r '.mergeable_state // empty' <<<"${DATA}")"
          if [[ ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ || ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::gh api returned an empty head/base SHA for PR #${PR_NUMBER} — cannot resolve live PR state."
            exit 1
          fi
          CHECKOUT_SHA="${MERGE_SHA}"
          SYNTHESIZE_MERGE="false"
          CACHED_BASE_SHA="$(jq -r '.base.sha // empty' <<<"${DATA}")"
          if [[ "${CACHED_BASE_SHA}" != "${BASE_SHA}" ]]; then
            echo "::warning::PR #${PR_NUMBER} cached base SHA ${CACHED_BASE_SHA:-<empty>} differs from authoritative ${BASE_REPO}:${BASE_REF} SHA ${BASE_SHA}; synthesizing the current merge from the exact branch head and authoritative base."
            CHECKOUT_SHA="${HEAD_SHA}"
            SYNTHESIZE_MERGE="true"
          elif [[ -z "${CHECKOUT_SHA}" ]]; then
            echo "::warning::PR #${PR_NUMBER} has no computed merge_commit_sha yet (GitHub still calculating mergeability, or the PR has a conflict) — falling back to the branch head SHA for checkout."
            CHECKOUT_SHA="${HEAD_SHA}"
          elif [[ "${MERGEABLE_STATE}" == "dirty" || "${MERGEABLE_STATE}" == "unknown" ]]; then
            # GitHub nulls merge_commit_sha and recomputes it asynchronously
            # whenever the base moves, but the field can still return a
            # STALE-but-present SHA during that recompute window (mergeable_state
            # is the freshness signal, not merge_commit_sha's mere presence). A
            # `dirty` (real conflict) or `unknown` (still computing) state means
            # the returned merge_commit_sha cannot be trusted as the current
            # merge preview, so fall back to the branch head SHA the same way
            # the null case above does, rather than checking out a snapshot that
            # may already be behind the live base.
            echo "::warning::PR #${PR_NUMBER} merge_commit_sha is present but mergeable_state=${MERGEABLE_STATE} (stale/still-computing merge preview) — falling back to the branch head SHA for checkout."
            CHECKOUT_SHA="${HEAD_SHA}"
          fi
          {
            echo "head_sha=${HEAD_SHA}"
            echo "base_sha=${BASE_SHA}"
            echo "checkout_sha=${CHECKOUT_SHA}"
            echo "synthesize_merge=${SYNTHESIZE_MERGE}"
            echo "author_login=${AUTHOR_LOGIN}"
          } >> "${GITHUB_OUTPUT}"
          # SECURITY (adversarial review, 2026-07-28): the PR body is fully
          # author-controlled. A FIXED heredoc delimiter here would let an
          # author terminate the multiline value early by putting the literal
          # delimiter string on its own line in their PR body, then inject
          # arbitrary `key=value` lines into this step's remaining
          # $GITHUB_OUTPUT — including overwriting head_sha/base_sha/
          # checkout_sha written above (GitHub Actions takes the LAST
          # occurrence of a given output name within a step). That would let a
          # PR author forge the very state this workflow exists to make
          # unforgeable. Per GitHub's own guidance, use a per-run random
          # delimiter an attacker cannot predict or embed in advance.
          BODY_DELIM="ghadelim_$(openssl rand -hex 16)"
          {
            echo "body<<${BODY_DELIM}"
            jq -r '.body // ""' <<<"${DATA}"
            echo "${BODY_DELIM}"
          } >> "${GITHUB_OUTPUT}"

      - name: Defer ordinary draft PR
        if: steps.live_pr.outputs.evaluate == 'false'
        run: |
          echo "Staging evidence is deferred for this ordinary draft PR."
          echo "The ready_for_review event runs the complete evidence gate."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.live_pr.outputs.evaluate == 'true'
        with:
          ref: ${{ steps.live_pr.outputs.checkout_sha }}
          fetch-depth: 0

      - name: Synthesize merge against authoritative base
        if: steps.live_pr.outputs.synthesize_merge == 'true'
        env:
          AUTHORITATIVE_BASE_SHA: ${{ steps.live_pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit "${AUTHORITATIVE_BASE_SHA}"

      - name: Setup Node.js
        if: steps.live_pr.outputs.evaluate == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install root dependencies (typescript + tsx + supabase-js)
        if: steps.live_pr.outputs.evaluate == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline

      - name: Run staging-evidence check
        if: steps.live_pr.outputs.evaluate == 'true'
        env:
          # Live-resolved (SCRUM-3026) — supersede the frozen event payload
          # for exactly the fields that go stale on a bare rerun.
          PR_BODY: ${{ steps.live_pr.outputs.body }}
          HEAD_REF_SHA: ${{ steps.live_pr.outputs.head_sha }}
          BASE_REF_SHA: ${{ steps.live_pr.outputs.base_sha }}
          # SCRUM-3481: live-resolved PR author login (never the PR body), used
          # only to reject a residual-risk note that approves its own author.
          PR_AUTHOR: ${{ steps.live_pr.outputs.author_login }}
          # CTO ruling 2026-07-28 (SCRUM-2980): hard precondition for the
          # deferred_consolidated_soak RC-manifest mode
          # (scripts/ci/check-staging-evidence.ts). `vars.*` is read fresh
          # from the repo's live Actions-variable state at THIS run, not
          # from the frozen webhook payload — so this positively confirms
          # (or positively fails to confirm) that deploy-worker.yml's
          # `deploy-gate` job is actually pausing Cloud Run deploys right
          # now, every time this check runs. See .github/workflows/
          # deploy-worker.yml and .github/workflows/agents.md "Deploy-worker
          # pause gate" for the deploy-side half of this coupled control.
          DEPLOY_WORKER_PAUSED: ${{ vars.DEPLOY_WORKER_PAUSED }}
          # TEMPORARY BYPASS — founder directive 2026-08-01 (relayed by the
          # CTO session). When this repository variable is the literal string
          # "true", scripts/ci/check-staging-evidence.ts short-circuits to a
          # pass and prints a `::warning::` banner stating that NO staging
          # soak evidence was evaluated. It exists so Mergify can drain the
          # CI-green queue ahead of the external pen test starting
          # 2026-08-02; the week-long consolidated soak that follows the pen
          # test is what produces the deferred evidence.
          #
          # RE-ENABLE BEFORE THAT SOAK IS GRADED:
          #   gh variable set SOAK_GATE_DISABLED --body false
          #
          # Like DEPLOY_WORKER_PAUSED above, `vars.*` is read fresh from the
          # repo's live Actions-variable state on THIS run, so it is
          # repo-admin state and not anything a PR author can set. Anything
          # other than the literal "true" leaves the gate fully enforcing.
          SOAK_GATE_DISABLED: ${{ vars.SOAK_GATE_DISABLED }}
        # Resolved local binary, not `npx tsx` (SonarCloud githubactions:S6505/
        # S8543 — `npx` can install packages on-demand and run their lifecycle
        # scripts). `npm ci` two steps above already installs the pinned
        # `"tsx": "4.23.1"` devDependency, so `node_modules/.bin/tsx` is
        # deterministic and uses the locked version. Matches the identical fix
        # for this exact class of finding in ci.yml:140 / ci.yml:939.
        run: node_modules/.bin/tsx scripts/ci/check-staging-evidence.ts
