name: Publish Python SDK

on:
  push:
    tags:
      - "arkova-py-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/arkova-py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Determine publication admission
        id: admission
        run: python ../../scripts/release/check-python-publish-admission.py

      - name: Setup locked Python package manager
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.3"
          enable-cache: true
          cache-dependency-glob: packages/arkova-py/uv.lock

      - name: Install locked development environment
        run: uv sync --locked --all-extras --python 3.12 --no-install-project --no-build

      - name: Build and install first-party distribution
        run: |
          rm -rf dist
          uv run --locked --no-sync --no-build python -m build --no-isolation
          wheels=(dist/*.whl)
          [[ ${#wheels[@]} -eq 1 && -f ${wheels[0]} ]]
          wheel_hash=$(sha256sum "${wheels[0]}" | cut -d ' ' -f 1)
          printf '%s --hash=sha256:%s\n' "${wheels[0]}" "$wheel_hash" > "$RUNNER_TEMP/arkova-wheel-requirements.txt"
          uv pip install --python .venv/bin/python --no-deps --no-build --require-hashes --requirement "$RUNNER_TEMP/arkova-wheel-requirements.txt"

      - name: Test installed wheel
        env:
          ARKOVA_TEST_INSTALLED_WHEEL: "1"
        run: uv run --locked --no-sync --no-build pytest

      - name: Lint
        run: uv run --locked --no-sync --no-build ruff check src tests

      - name: Publish to PyPI
        if: steps.admission.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/arkova-py/dist
