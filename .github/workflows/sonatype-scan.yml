name: sonatype-scan

on:
  pull_request:
    branches: [main]
    # Defer the four-workspace install/scan matrix for ordinary drafts. The
    # ready transition creates a fresh run.
    #
    # Actions-budget hygiene (2026-09-21): this `pull_request` trigger fires
    # far more often than the weekly `schedule` below implies — `gh run list`
    # showed 99 of the last 100 runs were `pull_request`, only 1 `schedule`.
    # That is largely intentional (the whole point is scanning a PR that
    # changes a manifest/lockfile) and largely FREE: GitHub Actions has no
    # actor-based `on:` filter, so a Dependabot-authored PR still creates a
    # counted workflow run even though the job's own `if:` below skips it
    # before any runner is provisioned — a skipped job bills zero minutes.
    # Measured: 18 of the last 40 runs were exactly this (skipped,
    # zero-cost). The one REAL waste this sweep found and fixed: Mergify
    # merge-queue speculative PRs previously forced a full re-scan (`&&
    # startsWith(github.head_ref, 'mergify/')` bypassed the draft check
    # outright) even though this job is advisory-only (no `.mergify.yml`
    # `check-success` entry — confirmed via grep) and the original PR already
    # ran it once. That accounted for 7 of the last 15 non-skipped runs. The
    # job `if:` below now skips genuine Mergify queue PRs the same
    # branch-prefix + `mergify[bot]`-author way `staging-evidence.yml` /
    # `ci.yml` do (SCRUM-3812 hardening — branch name alone is
    # author-controlled and spoofable).
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '.github/workflows/sonatype-scan.yml'
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch: {}

# Saves Actions minutes — newer commits cancel stale runs.
concurrency:
  group: sonatype-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # WIF auth needs this

jobs:
  sonatype-oss-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip on dependabot PRs — GitHub does NOT pass repo secrets to workflows
    # triggered from forks/dependabot, so the GCP Workload Identity step fails
    # with "the GitHub Action workflow must specify exactly one of
    # workload_identity_provider or credentials_json". The scheduled cron run
    # (Mondays 12:00 UTC) and human-author PRs still cover license/CVE checks.
    # This job-level skip bills ZERO runner minutes (no runner is provisioned
    # for a skipped job) — see the `on.pull_request` comment above for why
    # the workflow RUN still gets created anyway.
    #
    # Actions-budget hygiene (2026-09-21): also skip genuine Mergify
    # merge-queue speculative PRs — this job is advisory-only (not a
    # `.mergify.yml` `check-success` gate) and the original PR already ran
    # it, so re-scanning on every queue candidate was pure waste. Matches
    # the branch-prefix + `mergify[bot]`-author compound check
    # `staging-evidence.yml` / `ci.yml` already use (SCRUM-3812: the branch
    # prefix alone is author-controlled).
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !(startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.user.login == 'mergify[bot]') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - { name: root, path: . }
          - { name: worker, path: services/worker }
          - { name: edge, path: services/edge }
          - { name: embed, path: packages/embed }
          # packages/sdk excluded — no lockfile yet
    env:
      # OSS Index API caps `coordinates` at 128 entries per request.
      BATCH_SIZE: 128
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - id: gcp-auth
        name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - id: sonatype-secrets
        name: Pull Sonatype token from GCP Secret Manager
        continue-on-error: true   # don't block PRs if IAM not yet granted on `sonatype` secret
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262  # v3.0.0
        with:
          secrets: |
            token:arkova1/sonatype

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.workspace.path }}/package-lock.json

      - name: Install deps (${{ matrix.workspace.name }})
        working-directory: ${{ matrix.workspace.path }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate dependency manifest
        working-directory: ${{ matrix.workspace.path }}
        run: |
          npm ls --all --json --omit=dev > deps.json || true
          jq '[.. | objects | select(.version) | "pkg:npm/\(.name)@\(.version)"] | unique' deps.json > purls.json
          echo "PURL count: $(jq length purls.json)"

      - name: Sonatype OSS Index scan
        id: scan
        if: steps.sonatype-secrets.outputs.token != ''
        working-directory: ${{ matrix.workspace.path }}
        env:
          SONATYPE_TOKEN: ${{ steps.sonatype-secrets.outputs.token }}
        run: |
          jq -c "[_nwise($BATCH_SIZE)]" purls.json > batches.json
          BATCH_COUNT=$(jq length batches.json)
          echo "Posting $BATCH_COUNT batch(es) to OSS Index in parallel"
          mkdir -p batch-reports
          # Parallel POSTs — independent requests, ~6 batches typical, ~6× speedup.
          seq 0 $((BATCH_COUNT - 1)) | xargs -P 6 -I{} sh -c '
            jq ".[{}] | {coordinates: .}" batches.json | \
              curl -sSf -H "Authorization: Bearer '"$SONATYPE_TOKEN"'" \
                -H "Content-Type: application/json" \
                -X POST https://ossindex.sonatype.org/api/v3/component-report \
                -d @- > batch-reports/{}.json
          '
          jq -s 'add' batch-reports/*.json > report.json
          HIGH=$(jq '[.[] | .vulnerabilities[]? | select((.cvssScore // 0) >= 7)] | length' report.json)
          MED=$(jq '[.[] | .vulnerabilities[]? | select((.cvssScore // 0) >= 4 and (.cvssScore // 0) < 7)] | length' report.json)
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "medium=$MED" >> "$GITHUB_OUTPUT"
          {
            echo "## ${{ matrix.workspace.name }} dependency scan"
            echo ""
            echo "- HIGH (CVSS ≥ 7): **$HIGH**"
            echo "- MEDIUM (CVSS 4-6.9): **$MED**"
            echo ""
            jq -r '.[] | select(.vulnerabilities | length > 0) | "- `\(.coordinates)` — \(.vulnerabilities | length) issue(s)"' report.json | head -30
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$HIGH" -gt 0 ]; then
            echo "::error::${{ matrix.workspace.name }}: $HIGH HIGH-severity vulnerabilities — see job summary"
            exit 1
          fi

      - name: Warn if scan was skipped (no Sonatype token)
        if: steps.sonatype-secrets.outputs.token == ''
        run: |
          {
            echo "## ${{ matrix.workspace.name }} dependency scan — SKIPPED"
            echo ""
            echo "GCP Workload Identity Federation could not access the \`sonatype\` secret in project \`arkova1\` (PERMISSION_DENIED)."
            echo ""
            echo "Grant access:"
            echo ""
            echo '```bash'
            echo 'SA="$(gh secret get GCP_SERVICE_ACCOUNT)"   # or look up in repo settings'
            echo 'gcloud secrets add-iam-policy-binding sonatype \'
            echo '  --project=arkova1 \'
            echo "  --member=\"serviceAccount:\$SA\" \\"
            echo '  --role="roles/secretmanager.secretAccessor"'
            echo '```'
            echo ""
            echo "Once granted, the scan starts running on the next PR — no further code changes needed. See [docs/runbooks/mcp/sonatype.md](docs/runbooks/mcp/sonatype.md)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Sonatype scan skipped — IAM not granted on arkova1/sonatype secret"

      - name: Upload SBOM artifact
        if: always() && steps.sonatype-secrets.outputs.token != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # Disambiguate from the CycloneDX SBOM produced by ci.yml's sbom-generation job.
          name: sonatype-report-${{ matrix.workspace.name }}
          path: |
            ${{ matrix.workspace.path }}/deps.json
            ${{ matrix.workspace.path }}/purls.json
            ${{ matrix.workspace.path }}/report.json
          retention-days: 90
