name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number (used for Cloud Run tag and lease check)'
        required: true
        type: string
      source_ref:
        description: 'Git ref to build from (branch name or SHA)'
        required: true
        type: string
      service:
        description: 'Cloud Run service to deploy to'
        required: false
        type: string
        default: 'arkova-worker-staging'
      force_reason:
        description: 'If set, bypasses lease check (must start with SCRUM-NNNN:)'
        required: false
        type: string
        default: ''

concurrency:
  group: deploy-staging-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

env:
  PROJECT_ID: arkova1
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: arkova-worker-images

jobs:
  build-and-deploy:
    name: Build & Deploy PR #${{ inputs.pr_number }} to staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate inputs
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_SERVICE: ${{ inputs.service }}
          INPUT_FORCE_REASON: ${{ inputs.force_reason }}
        run: |
          if ! echo "${INPUT_PR_NUMBER}" | grep -qE '^[0-9]+$'; then
            echo "::error::pr_number must be a numeric value, got: ${INPUT_PR_NUMBER}"
            exit 1
          fi
          if ! echo "${INPUT_SOURCE_REF}" | grep -qE '^[a-zA-Z0-9/_.\-]+$'; then
            echo "::error::source_ref contains invalid characters"
            exit 1
          fi
          if ! echo "${INPUT_SERVICE}" | grep -qE '^[a-zA-Z0-9\-]+$'; then
            echo "::error::service name contains invalid characters"
            exit 1
          fi
          if [ -n "${INPUT_FORCE_REASON}" ] && ! echo "${INPUT_FORCE_REASON}" | grep -qE '^SCRUM-[0-9]+:'; then
            echo "::error::force_reason must start with SCRUM-NNNN:"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Resolve build SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build & push image
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          BUILD_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          # Keep staging on the same source-upload-free path as production:
          # runner-side Docker build, then Artifact Registry push.
          set -euo pipefail
          IMAGE_TAG="pr-${INPUT_PR_NUMBER}-$(echo "${BUILD_SHA}" | cut -c1-8)"
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/arkova-worker:${IMAGE_TAG}"
          LATEST_REF="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/arkova-worker:latest"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"
          docker build \
            --build-arg BUILD_SHA="${BUILD_SHA}" \
            --tag "${IMAGE_REF}" \
            --tag "${LATEST_REF}" \
            services/worker
          docker push "${IMAGE_REF}"
          docker push "${LATEST_REF}"

      - name: Use deploy script from main
        run: git fetch origin main && git checkout origin/main -- scripts/staging/deploy.sh

      - name: Fetch staging secrets
        id: secrets
        run: |
          echo "staging_url=$(gcloud secrets versions access latest --secret=supabase-url-staging --project=${{ env.PROJECT_ID }})" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$(gcloud secrets versions access latest --secret=supabase-service-role-key-staging --project=${{ env.PROJECT_ID }})"
          echo "staging_key=$(gcloud secrets versions access latest --secret=supabase-service-role-key-staging --project=${{ env.PROJECT_ID }})" >> "$GITHUB_OUTPUT"

      - name: Deploy to staging
        env:
          STAGING_SUPABASE_URL: ${{ steps.secrets.outputs.staging_url }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ steps.secrets.outputs.staging_key }}
          STAGING_CLOUD_RUN_SERVICE: ${{ inputs.service }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_FORCE_REASON: ${{ inputs.force_reason }}
          BUILD_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          FORCE_FLAG=""
          if [ -n "${INPUT_FORCE_REASON}" ]; then
            FORCE_FLAG="--force"
            FORCE_VALUE="${INPUT_FORCE_REASON}"
          fi
          bash scripts/staging/deploy.sh \
            --pr "${INPUT_PR_NUMBER}" \
            --image "${IMAGE_REF}" \
            --build-sha "${BUILD_SHA}" \
            ${FORCE_FLAG} ${FORCE_VALUE:+"${FORCE_VALUE}"}

      - name: Resolve staging base URL
        id: staging_url
        env:
          INPUT_SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          RAW_URL=$(gcloud run services describe "${INPUT_SERVICE}" \
            --region="${{ env.REGION }}" --project="${{ env.PROJECT_ID }}" \
            --format="value(status.url)")
          echo "raw_url=${RAW_URL}" >> "$GITHUB_OUTPUT"

      # Mint the Cloud Run ID token through the auth action, not gcloud. Under
      # Workload Identity Federation the ADC credential is already the deploy SA
      # *via* impersonation, so `gcloud auth print-identity-token` either can't
      # self-sign (no --impersonate) or triggers a second, self-impersonation
      # hop that needs tokenCreator-on-self (which we don't grant). The auth
      # action instead calls iamcredentials.generateIdToken with the *federated*
      # principal as the caller — and the WIF principalSet already holds
      # roles/iam.serviceAccountTokenCreator on the deploy SA, so no extra IAM
      # grant is required. Audience MUST be the base service URL (RAW_URL): Cloud
      # Run validates `aud` against the base URL and rejects a tag-audience token
      # with HTTP 401.
      - name: Mint Cloud Run ID token
        id: id_token
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: 'id_token'
          id_token_audience: ${{ steps.staging_url.outputs.raw_url }}
          id_token_include_email: true

      - name: Verify exact-head staging health
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          BUILD_SHA: ${{ steps.sha.outputs.sha }}
          RAW_URL: ${{ steps.staging_url.outputs.raw_url }}
          ID_TOKEN: ${{ steps.id_token.outputs.id_token }}
        run: |
          set -euo pipefail
          TAG="pr-${INPUT_PR_NUMBER}"
          TAG_URL="${RAW_URL/https:\/\//https://${TAG}---}"
          BODY=$(curl -fsS --max-time 20 \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            "${TAG_URL}/health?detailed=true")
          echo "${BODY}" | jq .
          echo "${BODY}" | jq -e --arg sha "${BUILD_SHA}" '
            .status == "healthy"
            and .git_sha == $sha
            and .checks.database.status == "ok"
            and .checks.anchoring.status == "ok"
            and .checks.kms.status == "ok"
          ' >/dev/null

      - name: Summary
        env:
          INPUT_SERVICE: ${{ inputs.service }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          BUILD_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          TAG="pr-${INPUT_PR_NUMBER}"
          RAW_URL=$(gcloud run services describe "${INPUT_SERVICE}" \
            --region="${{ env.REGION }}" --project="${{ env.PROJECT_ID }}" \
            --format="value(status.url)")
          TAG_URL="${RAW_URL/https:\/\//https://${TAG}---}"
          REVISION=$(gcloud run services describe "${INPUT_SERVICE}" \
            --region="${{ env.REGION }}" --project="${{ env.PROJECT_ID }}" \
            --format="value(status.latestCreatedRevisionName)")
          echo "## Staging Deploy Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| PR | #${INPUT_PR_NUMBER} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source ref | \`${INPUT_SOURCE_REF}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build SHA | \`${BUILD_SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${IMAGE_REF}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Revision | \`${REVISION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag URL | ${TAG_URL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | \`${INPUT_SERVICE}\` |" >> "$GITHUB_STEP_SUMMARY"
