name: CI

on:
  push:
    branches: [main, staging, develop]
    # Skip low-risk metadata-only changes — saves Actions minutes on public repo transition.
    # NOTE: docs/** is intentionally NOT ignored because API docs carry
    # contract surfaces checked by SCRUM-1581 vocabulary drift CI.
    # HANDOFF.md / CLAUDE.md are intentionally NOT in the ignore list.
    # The handoff-claims job (R0-6 / SCRUM-1252) lints HANDOFF.md edits and
    # CLAUDE.md changes carry rule contracts that need CI verification.
    paths-ignore:
      - 'LICENSE'
      - '.gitignore'
      - 'README.md'
      - 'memory/**.md'
  pull_request:
    branches: [main, staging, develop]
    paths-ignore:
      - 'LICENSE'
      - '.gitignore'
      - 'README.md'
      - 'memory/**.md'

# Cancel stale CI runs when a new commit is pushed to the same PR / branch.
# Saves ~30-50% of Actions minutes on active-dev branches where multiple
# commits land in quick succession.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ARK-SEC-012: Assign to env var to prevent expression injection in run blocks
  BASE_REF_SHA: ${{ github.event.pull_request.base.sha }}
  # CI should fail on real code/test problems, not one-off npm registry resets.
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_FACTOR: '2'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '10000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'

jobs:
  # Secret scanning - block commits containing secrets
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --only-verified

  # Dependency scanning - check for vulnerable packages
  dependency-scan:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # SCRUM-1246: full history so scripts/ci/lib/ciContext.ts can resolve
          # the PR base SHA. Without it the default shallow checkout cannot reach
          # the base commit, ciContext exits 1, every tsx check in this job dies,
          # and the required "Dependency Scanning" gate goes red — which silently
          # jammed the Mergify queue (queue-wide false failure, not a real vuln).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/worker/package-lock.json

      - name: Install dependencies
        # Dependency scanning does not execute the app. Suppress package
        # lifecycle scripts so this security gate cannot fail because a
        # transitive package postinstall tries to download external binaries.
        run: npm ci --ignore-scripts

      - name: Enforce pinned package versions
        env:
          # SCRUM-1005: pipe PR labels so the override label
          # `dep-range-intentional` works on PR runs. On `push` events
          # github.event.pull_request is null and this is empty.
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: npm run ci:dep-pinning

      - name: Enforce npm install script policy
        run: npm run ci:install-script-policy

      - name: Block raw staging gcloud deploy bypasses (SCRUM-1821)
        run: npm run ci:staging-gcloud-policy

      - name: Block new ad-hoc process.env reads in worker (SCRUM-1258)
        env:
          # PR labels feed the worker-env-adhoc-baseline-update override
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node_modules/.bin/tsx scripts/ci/check-worker-env-adhoc.ts

      - name: Block tracked filenames with spaces (SCRUM-1294)
        run: node_modules/.bin/tsx scripts/ci/check-filename-spaces.ts

      # SCRUM-2483 — ban raw fetch()/undici in services/worker/src outside a
      # reviewed allow-list; worker egress must route through the IP-pinned
      # safeFetch primitive (src/lib/safe-fetch.ts). WARN-FIRST: this step always
      # exits 0 and only annotates. The WARN→ERROR ratchet (BAN_RAW_FETCH_MODE=
      # error) lands in a SEPARATE PR after all egress is migrated to safeFetch.
      - name: Ban raw fetch/undici in worker egress (SCRUM-2483, warn-first)
        run: node_modules/.bin/tsx scripts/ci/ban-raw-fetch-worker.ts

      # WEBEXT-04 / SCRUM-2506 — CSP↔runtime-deps drift gate. Parses the deployed
      # CSP (vercel.json) and fails if any on-device runtime dep (Tesseract OCR /
      # NER model / PDF.js) would need an off-origin fetch or wasm eval the CSP
      # forbids. This is the config↔reality gate the 2026-06-16 §1.6 regression
      # lacked. Override: PR label `csp-runtime-deps-intentional`.
      - name: Block CSP↔runtime-deps drift (WEBEXT-04 / SCRUM-2506)
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node_modules/.bin/tsx scripts/ci/check-csp-runtime-deps.ts

      - name: Block duplicate source artifacts and repo-copy worktrees (SCRUM-1586)
        run: npm run ci:duplicate-artifacts

      - name: Block migration prefix collisions (SCRUM-1287)
        run: node_modules/.bin/tsx scripts/ci/check-migration-prefix-uniqueness.ts

      # S0-4.2 / SCRUM-2500 — local-file half of the full-ledger numeric-integrity
      # audit (network-free). The prod-ledger half runs in migration-drift.yml,
      # which already holds the read-only Supabase Management API token.
      - name: Audit local migration ledger integrity (SCRUM-2500)
        run: node_modules/.bin/tsx scripts/ci/check-ledger-numeric-integrity.ts

      # S0-4.3 — block colliding migration agents.md "Recent migrations" blocks
      # (CLAUDE.md §6); each block must carry a (PR #NNNN) discriminator.
      - name: Block migration agents.md collisions (S0-E4)
        run: node_modules/.bin/tsx scripts/ci/check-agents-md-migration-collision.ts

      # Backstop for the 2026-07-28 union-driver incident: a local
      # `merge.union.driver = true` shadowed git's built-in union algorithm with
      # a no-op, so merges silently kept "ours" and discarded "theirs" (169
      # lines lost off main across 31 commits). agents.md is append-only, so a
      # line in the merge base but not at head is content this branch deletes
      # from main on merge. Cause-agnostic by design.
      - name: Block dropped agents.md content (append-only)
        env:
          BASE_REF_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node_modules/.bin/tsx scripts/ci/check-agents-md-append-only.ts

      - name: Require justification for new anchors indexes (SCRUM-1286)
        run: npm run ci:anchor-index-justification

      - name: Block API scope vocabulary drift (SCRUM-1581)
        run: npm run ci:api-scope-vocabulary

      - name: Block credential type enum drift (SCRUM-2013)
        run: node_modules/.bin/tsx scripts/ci/check-credential-type-drift.ts

      - name: Block CREATE VIEW without security_invoker (SCRUM-1276)
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node_modules/.bin/tsx scripts/ci/check-views-security-invoker.ts

      - name: Block bare auth.uid() in new RLS policies (SCRUM-1278)
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node_modules/.bin/tsx scripts/ci/check-rls-auth-uid-wrap.ts

      - name: Block ENABLE RLS without policy (SCRUM-1275)
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node_modules/.bin/tsx scripts/ci/check-rls-policy-coverage.ts

      - name: Block inline crypto.createHmac in webhook handlers (SCRUM-1282)
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node_modules/.bin/tsx scripts/ci/check-webhook-hmac-consolidation.ts

      - name: Enforce container-image CVE scan gate (TVM/IVS)
        # deploy-worker.yml must keep a Trivy base-image CVE scan gating the
        # deploy on fixable HIGH/CRITICAL OS CVEs. This guard fails the PR if
        # that control is removed, unpinned, or weakened. Complements the npm
        # audit / Sonatype dependency scans below (which cover the library
        # layer). Control doc: docs/compliance/container-image-scanning.md.
        run: node_modules/.bin/tsx scripts/ci/check-image-scan-gate.ts

      - name: Run npm audit (root production dependencies)
        # Fail on critical severity. Known high-severity exceptions (no upstream fix):
        # - xlsx (SheetJS): GHSA-4r6h-8v6p-xvw6, GHSA-5pgg-2g8v-p4x9
        #   Client-side only, user-supplied files. Tracked for replacement post-launch.
        run: npm audit --audit-level=critical --omit=dev

      - name: Run npm audit (worker production dependencies)
        # Fail on critical severity. Known high-severity exceptions (no upstream fix):
        # - snarkjs -> bfj -> jsonpath -> underscore <=1.13.7: GHSA-qpx9-hpmf-5gmw
        #   DoS vuln, not exploitable server-side. Tracked for replacement.
        working-directory: services/worker
        run: npm ci --ignore-scripts && npm audit --audit-level=critical --omit=dev

  # SCRUM-1068: Sonatype SCA evidence job. Non-blocking for the first sprint;
  # GPL/AGPL/SSPL license policy is enforced locally even when Lifecycle
  # credentials are not yet present in repo secrets.
  sonatype-sca:
    name: sonatype-sca
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      SONATYPE_LIFECYCLE_URL: ${{ secrets.SONATYPE_LIFECYCLE_URL }}
      SONATYPE_LIFECYCLE_USERNAME: ${{ secrets.SONATYPE_LIFECYCLE_USERNAME }}
      SONATYPE_LIFECYCLE_PASSWORD: ${{ secrets.SONATYPE_LIFECYCLE_PASSWORD }}
      SONATYPE_LIFECYCLE_APPLICATION_ID: ${{ secrets.SONATYPE_LIFECYCLE_APPLICATION_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/worker/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install worker dependencies
        working-directory: services/worker
        run: npm ci --ignore-scripts

      - name: Enforce GPL/AGPL/SSPL deny-list
        run: npm run security:license-denylist

      - name: Run Sonatype Lifecycle evaluation
        # SCRUM-1248 (R0-2): continue-on-error stripped. Step is gated on
        # all four LIFECYCLE secrets being set; if they're absent the
        # step is skipped entirely (see "Skip Sonatype Lifecycle notice"
        # below). When secrets ARE set, real findings should fail the PR.
        if: env.SONATYPE_LIFECYCLE_URL != '' && env.SONATYPE_LIFECYCLE_USERNAME != '' && env.SONATYPE_LIFECYCLE_PASSWORD != '' && env.SONATYPE_LIFECYCLE_APPLICATION_ID != ''
        uses: sonatype/actions/evaluate@207984d4ff92b2f2aee69821a233fa086080794e # v1
        with:
          iq-server-url: ${{ env.SONATYPE_LIFECYCLE_URL }}
          username: ${{ env.SONATYPE_LIFECYCLE_USERNAME }}
          password: ${{ env.SONATYPE_LIFECYCLE_PASSWORD }}
          application-id: ${{ env.SONATYPE_LIFECYCLE_APPLICATION_ID }}
          scan-targets: package.json package-lock.json services/worker/package.json services/worker/package-lock.json

      - name: Skip Sonatype Lifecycle notice
        if: env.SONATYPE_LIFECYCLE_URL == '' || env.SONATYPE_LIFECYCLE_USERNAME == '' || env.SONATYPE_LIFECYCLE_PASSWORD == '' || env.SONATYPE_LIFECYCLE_APPLICATION_ID == ''
        run: echo "::warning::Sonatype Lifecycle scan skipped; configure SONATYPE_LIFECYCLE_* secrets to enable remote findings/comments."

  # SCRUM-1681: SonarCloud gate + New Code Definition drift guard.
  # PR #713 exposed that PR analysis can pass while the main-branch app check
  # fails under a stale `previous_version` New Code Definition. This job pulls
  # the token from GCP Secret Manager and fails if the project drifts back.
  sonar-quality-gate-config:
    name: SonarCloud Quality Gate Config
    if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - id: gcp-auth
        name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - id: sonarcloud-token
        name: Pull SonarCloud token from GCP Secret Manager
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |
            token:arkova1/sonar_cloud_token

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/worker/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify SonarCloud gate and New Code Definition
        env:
          # Source: GCP Secret Manager `arkova1/sonar_cloud_token`.
          SONARCLOUD_TOKEN: ${{ steps.sonarcloud-token.outputs.token }}
        run: npm run ci:sonar-quality-gate

  # Consolidated policy lints — 5 lightweight checks that share identical
  # setup (checkout, Node, npm ci). Running them sequentially in one job
  # eliminates 4 runner spin-ups (~8 min/PR saved).
  policy-lints:
    name: Policy Lints
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Aggregate commit messages
        id: commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            MSGS=$(git log --format=%B "$BASE_SHA"..HEAD)
          else
            MSGS=$(git log --format=%B -1)
          fi
          {
            echo 'msgs<<EOF'
            echo "$MSGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Coverage monotonic enforcement
        env:
          BASE_REF_SHA: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node_modules/.bin/tsx scripts/ci/check-coverage-monotonic.ts

      - name: "count:'exact' baseline"
        env:
          BASE_REF_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node_modules/.bin/tsx scripts/ci/check-count-exact-baseline.ts

      - name: Feedback rules
        env:
          BASE_REF_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: node_modules/.bin/tsx scripts/ci/check-feedback-rules.ts

      # S0-4.3 — tiered-merge authority (advisory). Computes the required tier
      # from the changed files (reusing requiredTierFor) and reports whether the
      # council may merge or it needs Carson. Fails closed to needs-carson.
      # Enforcement is branch protection + Mergify (Carson-applied per the
      # "S0-E4 — Mergify / Stacked-PR + Tiered-Merge Playbook" Google Doc, Drive
      # ARKOVA PI-1-S0); this step is informational + sets outputs.
      - name: Tiered-merge authority (S0-E4)
        env:
          BASE_REF_SHA: ${{ github.event.pull_request.base.sha }}
        run: node_modules/.bin/tsx scripts/ci/compute-merge-authority.ts

      - name: Config↔reality drift + cross-runtime parity gate (S0-5.2)
        run: node_modules/.bin/tsx scripts/ci/check-config-drift.ts

      - name: HANDOFF.md verification lint
        env:
          BASE_REF_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_COMMITS_MSGS: ${{ steps.commits.outputs.msgs }}
        run: node_modules/.bin/tsx scripts/ci/check-handoff-claims.ts

      - name: Confluence page coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_COMMITS_MSGS: ${{ steps.commits.outputs.msgs }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          FAIL_ON_MISSING_CONFLUENCE: 'false'
        run: node_modules/.bin/tsx scripts/ci/check-confluence-coverage.ts

  # TDD enforcement — production code changes must include test changes.
  # Actual enforcement runs only on pull_request events: TDD is a gate for
  # PRs being merged, not a retroactive check on main. On push events the
  # job trivially passes so downstream jobs with `needs: [tdd-enforcement]`
  # continue to run.
  tdd-enforcement:
    name: TDD Enforcement
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Enforce TDD (test files required for production changes)
        if: github.event_name == 'pull_request'
        run: bash scripts/enforce-tdd.sh --diff "$BASE_REF_SHA"

      - name: Skip notice (push event)
        if: github.event_name != 'pull_request'
        run: echo "TDD Enforcement is only evaluated on pull_request events"

  # Type checking and linting
  typecheck-lint:
    name: TypeCheck & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/worker/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript check (full)
        run: npm run typecheck

      - name: TypeScript build check (Vercel-safe)
        run: node_modules/.bin/tsc -p tsconfig.build.json --noEmit

      - name: Lint
        run: npm run lint

      - name: Lint batch-drain evidence tooling
        run: npm run lint:batch-drain-evidence

      - name: Lint UI copy terms
        run: npm run lint:copy

      # SCRUM-1250 (R0-4): worker lint runs in BOTH ci.yml (here) and
      # deploy-worker.yml — same `npm run lint` invocation, same source of
      # truth (services/worker/package.json + eslint.config.js). Catches
      # worker lint drift at PR time rather than at deploy time, so the
      # 2026-04-25 deploy-pipeline-down-for-12-hours scenario stops repeating.
      - name: Install worker dependencies
        working-directory: services/worker
        run: npm ci --ignore-scripts

      - name: Lint worker (deploy-gate parity)
        working-directory: services/worker
        run: npm run lint

      - name: Verify deploy-gate / CI lint parity (R0-4)
        # Fails CI if anyone reverts deploy-worker.yml back to inlined
        # `npx eslint src/ --max-warnings 0` (or any other drift). The
        # 2026-04-25 outage was caused by exactly this drift.
        run: node_modules/.bin/tsx scripts/ci/check-deploy-lint-parity.ts

      - name: Verify deploy-gate / CI worker BUILD parity
        # CONDITIONAL-GO sub-decision B — 3-way build-command parity guard.
        # Asserts services/worker/package.json scripts.build, the Dockerfile
        # `RUN npm run build`, and the new ci.yml worker compile step all run
        # the SAME build, so the PR-time compile gate cannot drift weaker than
        # the deployed image build. Pure file-reading hard invariant — no label,
        # env, or git dependency (mirrors check-deploy-lint-parity.ts), so it
        # runs cleanly in this shallow-checkout job. A build-command mismatch is
        # never acceptable; the escape hatch is editing the invariant in-PR
        # (with `ci-config-change` / `build-parity-ack` signoff), same as lint
        # parity.
        run: node_modules/.bin/tsx scripts/ci/check-deploy-build-parity.ts

      - name: Verify 429 responses include Retry-After
        run: npm run ci:retry-after-429

      - name: Verify agent API contract drift guards
        run: npm run ci:api-contract-drift

      - name: TypeScript check (edge workers)
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: node_modules/.bin/tsc -p services/edge/tsconfig.json --noEmit

  # Verify generated types are up to date
  types-check:
    name: Generated Types Check
    # CI-INFRA hotfix 2026-07-01: pinned off ubuntu-latest — a runner-image shift broke
    # supabase/setup-cli@v2.1.1's bun/musl setup step (glibc runner hit the musl-asset error).
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 1.123.0

      - name: Start Supabase
        id: supabase-start
        run: bash scripts/ci-supabase-start.sh
        continue-on-error: true

      - name: Generate types
        if: steps.supabase-start.outcome == 'success'
        run: npm run gen:types

      - name: Check for uncommitted type changes
        # SCRUM-1248 (R0-2): continue-on-error remains pending follow-up
        # sub-story to regenerate src/types/database.types.ts against the
        # current Supabase CLI version + commit. Last attempt produced a
        # 2,338-line drift dominated by Supabase CLI version differences
        # (graphql_public schema added, __InternalSupabase removed) — too
        # broad to ride along this PR. Sub-story tracked under SCRUM-1248.
        if: steps.supabase-start.outcome == 'success'
        continue-on-error: true
        run: |
          if [[ -n $(git status --porcelain src/types/database.types.ts) ]]; then
            echo "::warning::Generated types differ from committed version (production may have extra migrations)"
            echo "If this is unexpected, run 'npm run gen:types' and commit the changes"
            git diff --stat src/types/database.types.ts
          fi

      - name: Skip notice (no Docker)
        if: steps.supabase-start.outcome == 'failure'
        run: echo "::warning::Generated Types Check skipped — Supabase requires Docker (not available on this runner)"

  # Run tests
  test:
    name: Tests
    # CI-INFRA hotfix 2026-07-01: pinned off ubuntu-latest (see Generated Types Check).
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    needs: [typecheck-lint, tdd-enforcement]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # SCRUM-1249 (R0-3): scripts/ci/check-coverage-monotonic.test.ts
          # spawns the script which resolves BASE_REF_SHA (set globally at
          # ci.yml:29). On the default fetch-depth: 1 the PR base SHA isn't
          # in the local repo and resolveBaseRefOrFail exits 1.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/worker/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 1.123.0

      - name: Start Supabase
        run: bash scripts/ci-supabase-start.sh

      - name: Extract Supabase keys
        id: supabase-keys
        run: |
          SUPABASE_URL=$(supabase status --output json | jq -r '.API_URL')
          SUPABASE_ANON_KEY=$(supabase status --output json | jq -r '.ANON_KEY')
          SUPABASE_SERVICE_ROLE_KEY=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY')
          echo "::add-mask::$SUPABASE_ANON_KEY"
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          echo "url=$SUPABASE_URL" >> "$GITHUB_OUTPUT"
          echo "anon_key=$SUPABASE_ANON_KEY" >> "$GITHUB_OUTPUT"
          echo "service_role_key=$SUPABASE_SERVICE_ROLE_KEY" >> "$GITHUB_OUTPUT"

      - name: Run database reset
        run: supabase db reset

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run RLS tests
        # SCRUM-1301: 8 assertion failures resolved — migration 0265 restores
        # get_flag + chain/legal_hold protections; test assertions updated for
        # 0174 (SECURED not ACTIVE) and 0180 (unified error message).
        run: npm run test:rls
        env:
          SUPABASE_URL: ${{ steps.supabase-keys.outputs.url }}
          SUPABASE_ANON_KEY: ${{ steps.supabase-keys.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase-keys.outputs.service_role_key }}
          RLS_TEST_PASSWORD: Arkova2026!

      - name: Install worker dependencies
        working-directory: services/worker
        run: |
          for attempt in 1 2 3; do
            if npm ci --ignore-scripts; then
              break
            else
              status=$?
            fi

            if [ "$attempt" = "3" ]; then
              exit "$status"
            fi

            echo "::warning::Worker npm ci failed on attempt ${attempt}; retrying after transient registry/network failure."
            npm cache verify || true
            sleep $((attempt * 15))
          done

      # Cache the compiled zk circuit artifacts (~30 MB) keyed on circuit
      # source + circomlib version + build script. Cache hit skips the
      # ~30s circom compile + plonk setup; cache miss rebuilds from source.
      - name: Cache zk circuit artifacts
        id: cache-zk-artifacts
        uses: actions/cache@v6.1.0
        with:
          path: services/worker/circuits/artifacts
          key: zk-artifacts-${{ runner.os }}-circom2.1.9-${{ hashFiles('services/worker/circuits/extraction-proof.circom', 'services/worker/circuits/build.sh', 'services/worker/package-lock.json') }}

      - name: Install circom (cache miss only)
        if: steps.cache-zk-artifacts.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          CIRCOM_VERSION=v2.1.9
          mkdir -p "$HOME/.local/bin"
          # SCRUM-3018 / Sonar S6506: enforce HTTPS on the fetch and on any
          # redirect so a downgraded redirect can't serve the binary over http.
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 5 -o "$HOME/.local/bin/circom" \
            "https://github.com/iden3/circom/releases/download/${CIRCOM_VERSION}/circom-linux-amd64"
          # Pin the binary by SHA-256 — supply chain integrity for the toolchain.
          echo "e5575829252d763b7818049df9de2ef9304df834697de77fa63ce7babc23c967  $HOME/.local/bin/circom" | sha256sum -c -
          chmod +x "$HOME/.local/bin/circom"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build zk circuit artifacts (cache miss only)
        if: steps.cache-zk-artifacts.outputs.cache-hit != 'true'
        working-directory: services/worker
        run: npm run build:circuit

      - name: Verify zk circuit artifacts present
        # Belt-and-braces: fail the job loudly if the cache step succeeded
        # but the artifacts somehow aren't on disk. Without this, the
        # zk-proof integration tests would error at module load (which is
        # also fine — but earlier failure = clearer signal).
        run: |
          ls -lh services/worker/circuits/artifacts/extraction-proof_js/extraction-proof.wasm
          ls -lh services/worker/circuits/artifacts/extraction-proof_final.zkey
          ls -lh services/worker/circuits/artifacts/verification_key.json

      - name: Run worker tests with coverage
        working-directory: services/worker
        run: npm run test:coverage

  # AI eval regression gate (GAP-1) — catches prompt quality regressions before deploy
  ai-eval-gate:
    name: AI Eval Regression Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check if AI prompt/model code changed
        id: ai-changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(services/worker/src/ai/prompts/|services/worker/src/ai/gemini\.ts|services/worker/src/ai/schemas\.ts)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.ai-changed.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/worker/package-lock.json

      - name: Install worker dependencies
        if: steps.ai-changed.outputs.changed == 'true'
        working-directory: services/worker
        run: npm ci --ignore-scripts

      - name: Run AI eval against golden dataset (mock provider)
        if: steps.ai-changed.outputs.changed == 'true'
        working-directory: services/worker
        run: node_modules/.bin/vitest run src/ai/eval/ --reporter=verbose
        env:
          AI_PROVIDER: mock

      - name: Skip notice
        if: steps.ai-changed.outputs.changed != 'true'
        run: echo "No AI prompt/model changes detected — skipping eval gate"

  # SCRUM-1549 — golden distribution audit visibility.
  # This is intentionally informational while the committed audit evidence is
  # known to fail SCRUM-710's 5k/30-per-type/200-fraud gate. The job still runs
  # on every relevant PR so failed audit status is visible in CI instead of
  # living only in a markdown artifact. Set GOLDEN_AUDIT_ENFORCE=true when the
  # remediation data lands and this becomes a blocking launch gate.
  golden-distribution-audit:
    name: Golden Distribution Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOLDEN_AUDIT_ENFORCE: ${{ vars.GOLDEN_AUDIT_ENFORCE || 'false' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check if golden audit inputs changed
        id: golden-changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(.github/workflows/ci\.yml|services/worker/scripts/golden-distribution-audit\.ts|services/worker/scripts/golden-distribution-audit\.test\.ts|services/worker/training-data/|services/worker/docs/eval/golden-audit|services/worker/package\.json|services/worker/eslint\.config\.js)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.golden-changed.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/worker/package-lock.json

      - name: Install worker dependencies
        if: steps.golden-changed.outputs.changed == 'true'
        working-directory: services/worker
        run: npm ci --ignore-scripts

      - name: Run golden distribution audit
        if: steps.golden-changed.outputs.changed == 'true'
        working-directory: services/worker
        run: |
          set +e
          npm run audit:golden -- --json --out "$RUNNER_TEMP/golden-audit.json"
          audit_status=$?
          set -e

          if [ ! -s "$RUNNER_TEMP/golden-audit.json" ]; then
            echo "::error title=Golden audit did not produce JSON::audit:golden exited $audit_status before writing a report"
            exit "$audit_status"
          fi

          node <<'NODE'
          const fs = require('node:fs');
          let report;
          try {
            report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/golden-audit.json`, 'utf8'));
          } catch (error) {
            const message = error instanceof Error ? error.message : String(error);
            console.log(`::error title=Golden audit JSON parse failed::${message}`);
            process.exit(1);
          }
          const summary = ['## Golden Distribution Audit'];
          summary.push('### CI fixture smoke');
          summary.push(`- Verdict: ${report.passed ? 'PASSED' : 'FAILED'}`);
          summary.push(`- Total rows: ${report.audit.totalRows} / ${report.gate.minTotal}`);
          summary.push(`- Fraud-positive rows: ${report.audit.fraudPositive} / ${report.gate.minFraudPositive}`);
          summary.push(`- Unparseable rows: ${report.audit.unparseableRows}`);
          summary.push(`- Types under floor: ${report.typesUnderFloor.length}`);
          const evidencePath = 'docs/eval/golden-audit-2026-04-29.md';
          if (fs.existsSync(evidencePath)) {
            const evidence = fs.readFileSync(evidencePath, 'utf8');
            const verdict = evidence.match(/\*\*Verdict\.\*\* (PASSED|FAILED)/)?.[1] ?? 'UNKNOWN';
            const total = evidence.match(/\| Total rows \| ([^|]+) \| ([^|]+) \| ([^|]+) \|/) ?? [];
            const fraud = evidence.match(/\| Fraud-positive entries \| ([^|]+) \| ([^|]+) \| ([^|]+) \|/) ?? [];
            const underFloor = evidence.match(/\| Types under [^|]+ \| ([^|]+) \| ([^|]+) \| ([^|]+) \|/) ?? [];
            summary.push('');
            summary.push('### Committed SCRUM-710 evidence');
            summary.push(`- Verdict: ${verdict}`);
            if (total.length) summary.push(`- Total rows: ${total[1].trim()} / ${total[2].trim()} (${total[3].trim()})`);
            if (fraud.length) summary.push(`- Fraud-positive rows: ${fraud[1].trim()} / ${fraud[2].trim()} (${fraud[3].trim()})`);
            if (underFloor.length) summary.push(`- Types under floor: ${underFloor[1].trim()} / ${underFloor[2].trim()} (${underFloor[3].trim()})`);
            if (verdict === 'FAILED') {
              console.log('::warning title=Committed golden audit evidence failed::services/worker/docs/eval/golden-audit-2026-04-29.md records a FAILED SCRUM-710 gate.');
              if (process.env.GOLDEN_AUDIT_ENFORCE === 'true') process.exit(1);
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.join('\n')}\n`);
          if (!report.passed) {
            console.log(`::warning title=Golden audit failed::Dataset remains below SCRUM-710 gate: totalGap=${report.totalGap}, fraudGap=${report.fraudGap}, unparseableGap=${report.unparseableGap}, typesUnderFloor=${report.typesUnderFloor.length}`);
            if (process.env.GOLDEN_AUDIT_ENFORCE === 'true') process.exit(1);
          }
          NODE

      - name: Skip notice
        if: steps.golden-changed.outputs.changed != 'true'
        run: echo "No golden audit inputs changed — skipping distribution audit"

  # TLA+ state machine verification (TLA-02)
  tla-verify:
    name: TLA+ Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check if TLA+ model or anchor code changed
        id: tla-changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(machines/.*\.(ts|tla|cfg)$|services/worker/src/jobs/anchor\.ts|services/worker/src/chain/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.tla-changed.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.tla-changed.outputs.changed == 'true'
        run: npm ci --ignore-scripts

      - name: Set up Java (for TLC model checker)
        if: steps.tla-changed.outputs.changed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install TLA+ tools (tla2tools.jar)
        if: steps.tla-changed.outputs.changed == 'true'
        # `tla-precheck setup` prompts "Download TLC tla2tools.jar? (Y/n)"
        # and "Install skill to Claude Code + Codex? (Y/n)"; piping `yes`
        # keeps CI non-interactive.
        run: yes | node_modules/.bin/tla-precheck setup || true

      - name: Pin TLA2TOOLS_JAR (workaround tla-precheck checksum bug)
        # SCRUM-1248 (R0-2): tla-precheck@0.1.7 has a hard-coded expected
        # SHA256 for the v1.8.0 jar that no longer matches upstream. We
        # download the jar directly from the official tlaplus/tlaplus
        # release, verify SHA256 against a pinned value (SEC-004 baseline:
        # supply-chain integrity for every external download), and point
        # tla-precheck at it via TLA2TOOLS_JAR env. Remove this step when
        # tla-precheck ships a fix.
        #
        # Code-review #2 (PR #562): the SHA256 below is computed with
        # `curl ... | sha256sum` against the official release asset only after
        # the release body's SHA1 checksum matches the downloaded jar. The
        # v1.8.0 GitHub release is a mutable pre-release; do not update this
        # pin unless the official tlaplus/tlaplus release body also changed.
        if: steps.tla-changed.outputs.changed == 'true'
        env:
          # Pin updated 2026-07-21 - upstream RE-CUT the mutable v1.8.0
          # pre-release assets on 2026-07-18T14:54:57Z (jar bytes changed;
          # size 4357904 -> 4485995), which is why the prior pin failed the
          # supply-chain check. Verified per the protocol above against all
          # THREE independent anchors: (1) release-body SHA1 checksum table
          # now reads ae09269f0f74b9a7f69ac8b1e79f1514328082c6|tla2tools.jar
          # and matches the new jar's SHA1, (2) GitHub release API asset
          # digest is
          # sha256:cc4803dce2a8ffaf0f5920a9dc39df4b5ee34ab4cb53fb58ac557277a7e516b3,
          # (3) direct `curl | shasum -a 256` of the official release URL
          # matches (size 4485995). Previous pin (2026-07-09, now stale after
          # the 07-18 re-cut):
          # 33de7da9ce1b7fffb9d1c184021178dbb051747be48504e65c584c423721a32e
          TLA2TOOLS_SHA256: cc4803dce2a8ffaf0f5920a9dc39df4b5ee34ab4cb53fb58ac557277a7e516b3
        run: |
          mkdir -p "$HOME/.tla"
          # SCRUM-3018 / Sonar S6506: enforce HTTPS on the fetch and on any
          # redirect (GitHub release assets redirect to an https objects host).
          curl --proto '=https' --proto-redir '=https' -fsSL -o "$HOME/.tla/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar"
          ACTUAL=$(sha256sum "$HOME/.tla/tla2tools.jar" | awk '{print $1}')
          if [ "$ACTUAL" != "$TLA2TOOLS_SHA256" ]; then
            echo "::error::tla2tools.jar SHA256 mismatch — supply-chain integrity check failed"
            echo "  expected: $TLA2TOOLS_SHA256"
            echo "  actual:   $ACTUAL"
            exit 1
          fi
          echo "✅ tla2tools.jar SHA256 verified ($ACTUAL)"
          echo "TLA2TOOLS_JAR=$HOME/.tla/tla2tools.jar" >> "$GITHUB_ENV"

      - name: Run TLA+ PreCheck verification
        # SCRUM-1248 (R0-2): continue-on-error stripped. Per CLAUDE.md §1.7
        # TLA+ verification is mandatory on the bitcoinAnchor machine. The
        # job is conditional on machine/anchor/chain code actually changing.
        if: steps.tla-changed.outputs.changed == 'true'
        working-directory: machines
        # Invoke the RESOLVED LOCAL binary, not `npx tla-precheck` (SonarCloud
        # githubactions:S6505/S8543): `tla-precheck` is a pinned root
        # devDependency (package.json: exact "0.1.7", no caret) installed by the
        # `npm ci --ignore-scripts` step above, so `../node_modules/.bin/…` is
        # deterministic and uses the locked version — no on-demand install and
        # no lifecycle-script execution the way `npx` can do for a missing pkg.
        run: |
          ../node_modules/.bin/tla-precheck check bitcoinAnchor.machine.ts
          ../node_modules/.bin/tla-precheck check partnerProvisioning.machine.ts

  # Migration safety gate (SCALE-20) — verify migrations are additive-only
  migration-check:
    name: Migration Safety Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check for modified migrations (additive-only policy)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: |
          # Get changed files in this PR/push
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- 'supabase/migrations/*.sql' || true)
          if [ -z "$CHANGED" ]; then
            echo "No migration changes detected"
            exit 0
          fi

          echo "Changed migration files:"
          echo "$CHANGED"

          # Check for MODIFIED (not new) migrations — these violate additive-only policy
          # Only protect migrations through 0135 (last deployed to production).
          # Skip files that no longer exist (renames/consolidations are allowed).
          LAST_DEPLOYED=0135
          for file in $CHANGED; do
            if [ ! -f "$file" ]; then
              echo "Skipping deleted/renamed file: $file"
              continue
            fi
            # Extract numeric prefix from filename
            prefix=$(basename "$file" | grep -oE '^[0-9]+')
            if [ -n "$prefix" ] && [ "$prefix" -gt "$LAST_DEPLOYED" ] 2>/dev/null; then
              echo "Allowing modification to un-deployed migration: $file"
              continue
            fi
            if git log --oneline "$BASE_SHA" -- "$file" | head -1 | grep -q .; then
              echo "::error::MODIFIED existing migration: $file — write a compensating migration instead"
              exit 1
            fi
          done

          echo "All migration changes are new files (additive-only policy satisfied)"

      - name: Check migration naming convention
        run: |
          # Verify new migrations follow NNNN_descriptive_name.sql pattern
          for file in supabase/migrations/*.sql; do
            basename=$(basename "$file")
            if ! echo "$basename" | grep -qE '^[0-9]{4}[a-b]?_[a-z_]+\.sql$'; then
              echo "::warning::Migration $basename doesn't follow naming convention: NNNN_descriptive_name.sql"
            fi
          done

      - name: Check rollback comments
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- 'supabase/migrations/*.sql' || true)
          for file in $CHANGED; do
            if [ -f "$file" ] && ! grep -qi 'ROLLBACK' "$file"; then
              echo "::warning::Migration $file is missing a ROLLBACK comment section"
            fi
          done

  # End-to-end tests
  e2e:
    name: E2E Tests
    # CI-INFRA hotfix 2026-07-01: pinned off ubuntu-latest (see Generated Types Check).
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    needs: [typecheck-lint, test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Skip the ~25-min Playwright suite when a PR changes only files that
      # cannot affect app E2E flows (markdown/docs, memory notes, TLA models,
      # and the edge worker — none of which this run exercises). Any change
      # under src/, services/worker/, e2e/, supabase/, or build config forces
      # a full run. Fails safe: if the diff can't be computed, E2E runs. The
      # job keeps its "E2E Tests" name and always reports a result, so the
      # Mergify required check (.mergify.yml) is satisfied either way.
      - name: Detect E2E-relevant changes
        id: e2e-changed
        env:
          # PR events: diff the whole PR against its base tip.
          # Push events: diff the FULL pushed range (before -> HEAD), not just
          # HEAD~1 — a multi-commit push whose tip is docs-only must still run
          # E2E if an earlier commit in the same push touched app code. An
          # empty/all-zero/unreachable base (first push, force-push) makes the
          # git cat-file check below fail, which fails safe to running E2E.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # SCRUM-3018: never skip E2E on a push to a protected branch. The path
          # filter below is a PR-only cost optimization; on a push event it let a
          # docs-only tip skip Playwright yet still report the "E2E Tests" check
          # green, masking a real regression on main (run 30162406748, after
          # #1677). Any push (main/staging/develop per this workflow's triggers)
          # runs the full suite regardless of the diff. GITHUB_EVENT_NAME /
          # GITHUB_REF are default runner env vars, always set.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "Push event on $GITHUB_REF — always running full E2E suite (SCRUM-3018)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "Base ref '$BASE_SHA' empty or unreachable — running E2E to be safe"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! CHANGED=$(git diff --name-only "$BASE_SHA" HEAD); then
            echo "Could not compute diff against $BASE_SHA — running E2E to be safe"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CHANGED" ]; then
            echo "No changed files detected — skipping Playwright suite"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RELEVANT=$(printf '%s\n' "$CHANGED" | grep -vE '(\.md$|^docs/|^memory/|^machines/|^services/edge/|^LICENSE$|^\.gitignore$)' || true)
          if [ -n "$RELEVANT" ]; then
            echo "E2E-relevant files changed — running suite:"
            printf '%s\n' "$RELEVANT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only non-functional files changed — skipping Playwright suite:"
            printf '%s\n' "$CHANGED"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.e2e-changed.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/worker/package-lock.json

      - name: Install dependencies
        if: steps.e2e-changed.outputs.changed == 'true'
        run: npm ci --ignore-scripts

      - name: Install worker dependencies
        if: steps.e2e-changed.outputs.changed == 'true'
        working-directory: services/worker
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        if: steps.e2e-changed.outputs.changed == 'true'
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Setup Supabase CLI
        if: steps.e2e-changed.outputs.changed == 'true'
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 1.123.0

      - name: Start Supabase
        if: steps.e2e-changed.outputs.changed == 'true'
        run: bash scripts/ci-supabase-start.sh

      - name: Extract Supabase keys
        id: supabase-e2e-keys
        if: steps.e2e-changed.outputs.changed == 'true'
        run: |
          E2E_URL=$(supabase status --output json | jq -r '.API_URL')
          E2E_ANON_KEY=$(supabase status --output json | jq -r '.ANON_KEY')
          E2E_SERVICE_KEY=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY')
          echo "::add-mask::$E2E_ANON_KEY"
          echo "::add-mask::$E2E_SERVICE_KEY"
          echo "url=$E2E_URL" >> "$GITHUB_OUTPUT"
          echo "anon_key=$E2E_ANON_KEY" >> "$GITHUB_OUTPUT"
          echo "service_key=$E2E_SERVICE_KEY" >> "$GITHUB_OUTPUT"

      - name: Seed database
        if: steps.e2e-changed.outputs.changed == 'true'
        run: supabase db reset

      - name: Create auth state directory
        if: steps.e2e-changed.outputs.changed == 'true'
        run: mkdir -p .auth

      - name: Start worker for E2E tests
        if: steps.e2e-changed.outputs.changed == 'true'
        working-directory: services/worker
        run: |
          node --import tsx src/index.ts > "$RUNNER_TEMP/arkova-worker.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/arkova-worker.pid"
          # 120s health budget: tsx cold-compiles the worker on first boot, so
          # slow runners can push past the old 60s ceiling. The gate stays
          # hard-fail (exit 1) — specs must never run against a dead worker;
          # the longer wait only reduces false negatives on slow boots.
          for i in {1..120}; do
            if curl -fsS http://localhost:3001/health >/dev/null; then
              echo "Worker is ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Worker failed to become healthy for E2E"
          cat "$RUNNER_TEMP/arkova-worker.log"
          exit 1
        env:
          PORT: 3001
          NODE_ENV: test
          LOG_LEVEL: warn
          SUPABASE_URL: ${{ steps.supabase-e2e-keys.outputs.url }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase-e2e-keys.outputs.service_key }}
          STRIPE_SECRET_KEY: sk_test_e2e_local
          STRIPE_WEBHOOK_SECRET: whsec_e2e_local
          API_KEY_HMAC_SECRET: e2e-local-api-key-hmac-secret
          USE_MOCKS: true
          ENABLE_VERIFICATION_API: true
          ENABLE_PROD_NETWORK_ANCHORING: false
          BITCOIN_NETWORK: signet
          FRONTEND_URL: http://localhost:5173
          CORS_ALLOWED_ORIGINS: http://localhost:5173

      - name: Run E2E tests
        if: steps.e2e-changed.outputs.changed == 'true'
        # SCRUM-1620: E2E failures and timeouts are launch-blocking signals.
        # Workers=1 in playwright.config.ts; timeout 25 min keeps cold runners
        # from getting cut mid-suite while still failing the job on timeout.
        run: node_modules/.bin/playwright test --project=chromium
        timeout-minutes: 25
        env:
          VITE_SUPABASE_URL: ${{ steps.supabase-e2e-keys.outputs.url }}
          VITE_SUPABASE_ANON_KEY: ${{ steps.supabase-e2e-keys.outputs.anon_key }}
          E2E_SUPABASE_URL: ${{ steps.supabase-e2e-keys.outputs.url }}
          E2E_SUPABASE_SERVICE_KEY: ${{ steps.supabase-e2e-keys.outputs.service_key }}
          E2E_SEED_PASSWORD: Arkova2026!
          E2E_WORKER_URL: http://127.0.0.1:3001

      - name: E2E skipped (no app-affecting changes)
        if: steps.e2e-changed.outputs.changed != 'true'
        run: echo "No src/worker/e2e/supabase/config changes detected — Playwright suite skipped; reporting green."

      - name: Upload worker log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-worker-log
          path: ${{ runner.temp }}/arkova-worker.log
          retention-days: 14

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Performance budget gate (PERF-14) — Lighthouse CI on PR builds
  lighthouse:
    name: Lighthouse Performance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [typecheck-lint]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

      - name: Run Lighthouse CI
        # SCRUM-1303: baseline established in .lighthouse-baseline.json.
        # Thresholds in .lighthouserc.json are set ~10% below baseline.
        # Update baselines by running `npx lhci collect` on main.
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: '.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  # Lockfile integrity check (CISO Action-9) — prevent supply-chain attacks via tampered lockfiles
  lockfile-integrity:
    name: Lockfile Integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      # SCRUM-3018 / Sonar S6505,S8543: lockfile-lint is now a pinned
      # devDependency. Run the local, lockfile-verified binary instead of `npx`
      # fetching an unpinned copy from the registry at runtime — a supply-chain
      # smell that is doubly ironic for the lockfile-integrity check itself.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify root lockfile integrity
        run: node_modules/.bin/lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https
      - name: Verify worker lockfile integrity
        run: node_modules/.bin/lockfile-lint --path services/worker/package-lock.json --type npm --allowed-hosts npm --validate-https

  # SBOM generation (CISO Action-10) — produce CycloneDX bill of materials on main
  sbom-generation:
    name: SBOM Generation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/worker/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate frontend SBOM (CycloneDX)
        # `--ignore-npm-errors` lets us emit a best-effort SBOM when the
        # dep tree has legitimate peer-range drift (e.g. zod 3.24 vs
        # zod-to-json-schema's ^3.25.28 || ^4 peer). The SBOM still captures
        # the resolved tree — we just don't fail the job on `npm ls` warnings.
        run: node_modules/.bin/cyclonedx-npm --ignore-npm-errors --output-file sbom-frontend.json --output-format JSON
      - name: Generate worker SBOM (CycloneDX)
        run: |
          cd services/worker
          npm ci --ignore-scripts
          ../../node_modules/.bin/cyclonedx-npm --ignore-npm-errors --output-file ../../sbom-worker.json --output-format JSON
      - name: Generate license summary (DEP-09)
        run: |
          node_modules/.bin/license-checker --json --production > license-summary-frontend.json 2>/dev/null || true
          cd services/worker && ../../node_modules/.bin/license-checker --json --production > ../../license-summary-worker.json 2>/dev/null || true
      - name: Flag GPL/AGPL/SSPL licenses
        run: |
          echo "=== GPL/AGPL/SSPL License Check ==="
          for f in license-summary-frontend.json license-summary-worker.json; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              node -e "const d=JSON.parse(require('fs').readFileSync('$f','utf8'));Object.entries(d).filter(([,v])=>/GPL|AGPL|SSPL/i.test(v.licenses||'')).forEach(([k,v])=>console.log(k,v.licenses))" || true
            fi
          done
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: |
            sbom-frontend.json
            sbom-worker.json
            license-summary-frontend.json
            license-summary-worker.json
          retention-days: 90

  # PROOF-07 (SCRUM-2340) — standalone reference verifier CLI.
  # CLEAN-ROOM: the test suite must pass with NO Arkova network reachable.
  # We blackhole every Arkova host in /etc/hosts before running the suite, so
  # any accidental call to Arkova fails loudly instead of silently passing.
  verifier-cli:
    name: Verifier CLI (clean-room)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/verifier-cli
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/verifier-cli/package-lock.json

      # The CLI consumes @arkova/verifier (PROOF-07 / #1349) as a file: dep, so
      # its dist (the SHARED confirmInclusion + Esplora decode) must be built
      # before the CLI installs/links it. This is a pure local build — no network
      # to Arkova — so the clean-room assertion below is unaffected.
      - name: Build @arkova/verifier dependency
        working-directory: packages/verifier
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Blackhole Arkova hosts (clean-room assertion)
        working-directory: .
        run: |
          for h in arkova.io api.arkova.io app.arkova.ai arkova.ai docs.arkova.ai edge.arkova.dev arkova.com; do
            echo "0.0.0.0 $h" | sudo tee -a /etc/hosts
          done
          echo "Arkova hosts blackholed — the verifier suite must be fully offline:"
          grep arkova /etc/hosts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (offline / no Arkova reachable)
        run: npm test

      - name: Build CLI
        run: npm run build

      - name: Smoke-run the CLI offline against a fixture
        run: |
          node -e "const f=require('./fixtures/synthetic-vectors.json');require('fs').writeFileSync('/tmp/p.json',JSON.stringify(f.fixtures.find(x=>x.name==='odd-leaf-pass').packet))"
          node dist/cli.js /tmp/p.json --offline | tee /tmp/out.txt
          grep -q 'VERDICT: VERIFIED' /tmp/out.txt

  # CONDITIONAL-GO sub-decision B (TWO-SURFACE) — PR-time WORKER compile gate.
  # CI historically never compiled the worker source with tsc (root tsconfigs
  # exclude services/; worker CI was eslint + vitest only), so a worker TS error
  # could pass every PR check and only surface in the Dockerfile build at deploy
  # time (the deploy-typecheck blackout class). This job runs the EXACT Dockerfile
  # build (`npm run build` == `tsc -p tsconfig.build.json`) at PR time.
  #
  # NON-REQUIRED for now (not in branch protection / .mergify.yml) — reports
  # status while we gather the empirical RED list before the CEO-gated flip.
  #
  # In-job path filter (mirrors the E2E / ai-eval-gate pattern): the job ALWAYS
  # runs and ALWAYS posts a result (never absent), so a future required-flip
  # cannot strand a non-matching PR in Mergify on an absent check. The install +
  # build steps are guarded on the diff actually touching worker source/config.
  worker-build-parity:
    name: Worker Build (deploy-parity)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect worker source/build changes
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ] && git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            DIFF=$(git diff --name-only "origin/$BASE_REF...HEAD")
          else
            DIFF=$(git diff --name-only HEAD~1 HEAD || true)
          fi
          if printf '%s\n' "$DIFF" | grep -qE '^(services/worker/(src/|scripts/|package(-lock)?\.json|tsconfig(\.build)?\.json|Dockerfile)|\.github/workflows/ci\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changed.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/worker/package-lock.json

      - name: Install worker dependencies
        if: steps.changed.outputs.changed == 'true'
        working-directory: services/worker
        run: npm ci --ignore-scripts

      # The EXACT Dockerfile compile (`npm run build` == `tsc -p tsconfig.build.json`).
      # Step name carries the `deploy-parity` marker that check-deploy-build-parity.ts
      # keys on — keep it.
      - name: Build worker (deploy-parity)
        if: steps.changed.outputs.changed == 'true'
        working-directory: services/worker
        run: npm run build

      - name: Skip notice (no worker source/build changes)
        if: steps.changed.outputs.changed != 'true'
        run: echo "No services/worker source/build changes detected — worker compile gate skipped; reporting green."

  # CONDITIONAL-GO sub-decision B (TWO-SURFACE) — PR-time VERIFIER compile gate.
  # packages/verifier (the standalone @arkova/verifier) only ever built on
  # sdk-v* tags, so a PR could land a TS error in the reference verifier and CI
  # would never compile it. This job runs the verifier's own typecheck (tsc) +
  # build (tsup) at PR time. Same always-run in-job path-filter contract.
  # NON-REQUIRED for now.
  verifier-build:
    name: Verifier Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect verifier changes
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ] && git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            DIFF=$(git diff --name-only "origin/$BASE_REF...HEAD")
          else
            DIFF=$(git diff --name-only HEAD~1 HEAD || true)
          fi
          if printf '%s\n' "$DIFF" | grep -qE '^(packages/verifier/|\.github/workflows/ci\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changed.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/verifier/package-lock.json

      - name: Install verifier dependencies
        if: steps.changed.outputs.changed == 'true'
        working-directory: packages/verifier
        run: npm ci --ignore-scripts

      - name: Typecheck verifier (tsc)
        if: steps.changed.outputs.changed == 'true'
        working-directory: packages/verifier
        run: npm run typecheck

      - name: Build verifier (tsup)
        if: steps.changed.outputs.changed == 'true'
        working-directory: packages/verifier
        run: npm run build

      - name: Skip notice (no verifier changes)
        if: steps.changed.outputs.changed != 'true'
        run: echo "No packages/verifier changes detected — verifier compile gate skipped; reporting green."

  # SCRUM-2897 — evidence-identity gate, REPORT-ONLY.
  # Asserts that a Ready, soak-tier PR's Staging Soak Evidence block binds to the
  # exact commit + clean environment it claims:
  #   A. declared `PR head SHA:` == the actual PR head SHA (a commit pushed after
  #      the evidence was written silently invalidates the exact-head soak).
  #   B. clean-preflight identity — preflight is `environment_type=clean_mirror`
  #      (T2/T3) and any head SHA embedded in the preflight matches the declared
  #      head (evidence may not be copied across heads — CLAUDE.md §1.11A).
  # Drafts and T0 / no-evidence PRs are skipped.
  #
  # W3-freeze CTO carve-out: REPORT-ONLY / warn mode only — `--report-only`
  # makes the CLI always exit 0 (notice/warning annotations, never ::error::),
  # plus continue-on-error. Gates nothing. Fail-closed activation is deferred
  # until >=1 real green soak calibrates it (#1617 T0-CI-infra precedent).
  # Runs only on pull_request events (needs PR head/draft context). NON-REQUIRED.
  evidence-identity-report:
    name: Evidence-identity gate (report-only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Run evidence-identity gate (report-only, non-gating)
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: node_modules/.bin/tsx scripts/ci/check-evidence-identity.ts --report-only

  # SCRUM-2977 — anti-hollow-soak pre-clock guards, REPORT-ONLY.
  # A "hollow soak" burns real wall-clock while the PR's changed behavior is
  # never exercised (flag off / no OIDC / unfunded rig / no provenance / base
  # drift). scripts/ci/anti-hollow-soak/guards.ts runs the five pre-clock
  # checks over a soak-preflight JSON and would block the clock on any hollow
  # signature.
  #
  # W3-freeze CTO carve-out: this job is wired in REPORT-ONLY / warn mode only —
  # it prints findings and ALWAYS exits 0, gating nothing. Fail-closed
  # activation (dropping `--report-only`) is deferred until >=1 real green soak
  # calibrates the guards, mirroring the #1617 T0-CI-infra precedent. The step
  # also carries continue-on-error as belt-and-suspenders so this can never
  # block a merge during calibration. NON-REQUIRED.
  anti-hollow-soak-report:
    name: Anti-hollow-soak guards (report-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Run anti-hollow-soak guards (report-only, non-gating)
        continue-on-error: true
        run: |
          shopt -s nullglob
          preflights=(docs/staging/soak-preflight/*.json)
          if [ ${#preflights[@]} -eq 0 ]; then
            echo "::notice::No soak-preflight JSON under docs/staging/soak-preflight/ — anti-hollow-soak guards have nothing to check (report-only, non-gating)."
            node_modules/.bin/tsx scripts/ci/anti-hollow-soak/guards.ts --report-only || true
            exit 0
          fi
          for f in "${preflights[@]}"; do
            echo "== anti-hollow-soak (report-only) :: $f =="
            node_modules/.bin/tsx scripts/ci/anti-hollow-soak/guards.ts --report-only --input "$f" || true
          done
          exit 0
