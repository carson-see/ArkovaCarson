name: gitleaks

# Secret-scanning gate. Runs the repo's .gitleaks.toml (SEC-015) against the
# PR's NEW commits only — legacy fixtures already in history do not trip it,
# so this is safe to add without wedging the Mergify queue. It becomes a
# blocking gate only if/when branch protection promotes it to a required check.
#
# Added 2026-07-14 after the Sekura phase-1 SAST scan: the config existed but
# nothing ran it. This closes that gap.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Newer commits cancel stale runs — saves Actions minutes (matches ci.yml).
concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the diff range resolves

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          # SonarCloud githubactions:S6506: -L is required here (GitHub release
          # assets redirect to objects.githubusercontent.com), so the download
          # carries the --proto '=https' floor instead. --proto is a hard
          # ceiling that applies to redirects too, so a downgraded Location is
          # refused rather than followed.
          curl --proto '=https' -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          # Supply-chain integrity per .github/workflows/agents.md: external
          # downloads MUST verify SHA256. Pinned 2026-08-20, cross-checked
          # against the upstream gitleaks_8.30.1_checksums.txt — refresh both
          # together when VERSION moves.
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan new commits for hardcoded secrets
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            BEFORE="${{ github.event.before }}"
            # First push to a new branch reports an all-zero "before" SHA.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="${BEFORE}..${{ github.sha }}"
            fi
          fi
          echo "Scanning commit range: $RANGE"
          gitleaks git \
            --config .gitleaks.toml \
            --log-opts="$RANGE" \
            --redact \
            --verbose \
            --report-format json \
            --report-path gitleaks-report.json

      - name: Upload findings report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
