name: Deploy Edge Worker

# SCRUM-3907 / SCRUM-1032 (source: SCRUM-3797) — GitHub Actions deploy
# pipeline for the Cloudflare edge worker (services/edge, hosted MCP at
# edge.arkova.ai). Prod arkova-edge was a pre-June manual `wrangler deploy`
# with no CI/CD path at all — `git grep wrangler origin/main --
# .github/workflows/` returned zero files before this — so PR #2589's ES256
# verifier fix (and the SCRUM-3797 audit-log fix) sat on `main`, merged, for
# months without ever reaching prod. This workflow deploys on push to `main`,
# dry-runs the bundle on every PR (SCRUM-1032 AC), and its parity-check step
# fails the job outright if the deployed `/health` git_sha does not match the
# commit it just deployed — see `services/edge/src/build-info.ts` and
# `scripts/ci/check-edge-deployed-version.ts` for the read side of the same
# mechanism.
#
# Mirrors deploy-worker.yml's GCP auth (WIF) pattern only — NOT its secret
# consumption. `cloudflare-api-token` already exists in Secret Manager
# (project arkova1, consumed there via Cloud Run's --set-secrets for the
# WORKER's own outbound Cloudflare calls, entirely at Cloud Run's own
# runtime), but there is NO `CLOUDFLARE_*` GitHub Actions secret (verified
# via `gh secret list` — SCRUM-3907 investigation) and none is added here.
# CORRECTION (2026-09-14, SCRUM-3907 incident): this paragraph previously
# claimed this workflow reads the value "exactly as deploy-worker.yml does" —
# that was false, and the false equivalence is what produced the incident.
# deploy-worker.yml NEVER reads this secret's raw value on the GitHub Actions
# runner at all; Cloud Run pulls it directly via --set-secrets at ITS OWN
# runtime, so the runner never sees it and needs no Secret Manager grant for
# it. This workflow is different: `wrangler deploy` needs the raw token
# value ON THE RUNNER (to hand to the Cloudflare API), so it reads
# `cloudflare-api-token` directly via `gcloud secrets versions access` in the
# steps below — a genuinely new access pattern, not a mirror of an existing
# one. That means the GitHub Actions deploy identity
# (`github-actions-deploy@arkova1.iam.gserviceaccount.com`) needs its own
# explicit `roles/secretmanager.secretAccessor` grant scoped to this one
# secret, which nobody added when this workflow was written (there was
# nothing to copy it from). Granted 2026-09-14 (secret-level binding only,
# no project-level role); see the PR that fixed this for the exact command.
# See .github/workflows/agents.md for the full rationale + the
# DEPLOY_EDGE_PAUSED pause-gate contract (mirrors DEPLOY_WORKER_PAUSED).

on:
  push:
    branches: [main]
    paths:
      - 'services/edge/**'
      - '.github/workflows/edge-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/edge/**'
      - '.github/workflows/edge-deploy.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch, tag, or full SHA). Defaults to main.'
        type: string
        required: false
        default: 'main'

# One edge deploy at a time — two overlapping `wrangler deploy` runs racing
# to publish different versions would make "which commit is actually live"
# (the whole point of this workflow) briefly undefined. Mirrors
# deploy-worker.yml's `group: deploy-worker` / cancel-in-progress: false.
concurrency:
  group: deploy-edge
  cancel-in-progress: false

env:
  PROJECT_ID: arkova1

jobs:
  # Runs for every trigger (push / pull_request / workflow_dispatch) — the
  # quality gate that must pass before either the PR dry-run or the real
  # deploy proceeds.
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/edge
    outputs:
      resolved-sha: ${{ steps.resolve-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          # This job runs on every trigger including `pull_request` (fork PRs
          # included) and then runs `npm ci` against PR-supplied
          # package.json/package-lock.json — don't leave a live GITHUB_TOKEN
          # in git config for anything that install step executes.
          persist-credentials: false

      - name: Resolve deploy SHA
        id: resolve-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/edge/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # PR trigger only — validates the bundle builds and wrangler.toml is
  # coherent WITHOUT publishing anything or touching the Cloudflare API
  # token. `wrangler deploy --dry-run` builds + validates the Worker bundle
  # locally; it does not call the Cloudflare API, so a PR (same-repo or
  # fork) never needs the deploy credential. Satisfies SCRUM-1032 AC
  # "Dry-run / preview deploy on PR (no production push)".
  dry-run:
    name: Dry run (PR)
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/edge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR-triggered (fork PRs included) and runs `npm ci` against
          # PR-supplied package.json/package-lock.json right below — don't
          # leave a live GITHUB_TOKEN in git config for that install step.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/edge/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate build-info (dry run — not written back to git)
        run: node scripts/generate-build-info.mjs "${{ github.event.pull_request.head.sha }}"

      # SonarCloud githubactions:S6505/S8543 -- `--no-install` refuses to
        # fall back to an on-demand fetch-and-run if the local copy is ever
        # missing (closing the "npx can install and run arbitrary lifecycle
        # scripts" path), and the pinned `@4.130.0` (must match the
        # `wrangler` devDependency in package.json) satisfies "define exact
        # package version" instead of resolving whatever `wrangler` means at
        # run time.
      - name: wrangler deploy --dry-run
        run: npx --no-install wrangler@4.130.0 deploy --dry-run

  # push-to-main / workflow_dispatch only — evaluates the pause gate BEFORE
  # any deploy work runs. Mirrors deploy-worker.yml's `deploy-gate` job:
  # workflow_dispatch always bypasses the pause (a human explicitly
  # dispatching this workflow is by definition an intentional deploy).
  deploy-gate:
    name: Evaluate DEPLOY_EDGE_PAUSED
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Evaluate DEPLOY_EDGE_PAUSED
        id: check
        env:
          PAUSED: ${{ vars.DEPLOY_EDGE_PAUSED }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ needs.test.outputs.resolved-sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Manual workflow_dispatch by ${ACTOR} — deploy proceeds regardless of DEPLOY_EDGE_PAUSED (intentional-override path)."
            exit 0
          fi

          if [ "$PAUSED" = "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### :no_entry: DEPLOY PAUSED — edge deploy skipped for this push"
              echo
              echo "\`vars.DEPLOY_EDGE_PAUSED=true\`. Commit \`${SHA}\` passed \`test\` (typecheck/vitest) but the \`deploy\` job's \`wrangler deploy\` was **not executed**."
              echo
              echo "**To deploy this commit anyway (human, intentional):** Actions tab -> Deploy Edge Worker -> Run workflow (or \`gh workflow run edge-deploy.yml\`). \`workflow_dispatch\` always bypasses this pause."
              echo
              echo "**To resume automatic deploys for all future pushes:** \`gh variable set DEPLOY_EDGE_PAUSED --body false\` or \`gh variable delete DEPLOY_EDGE_PAUSED\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::DEPLOY PAUSED (vars.DEPLOY_EDGE_PAUSED=true) — edge deploy SKIPPED for commit ${SHA}. See job summary for why + how to re-enable/override."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy & verify parity
    if: github.event_name != 'pull_request' && needs.deploy-gate.result == 'success' && needs.deploy-gate.outputs.proceed == 'true'
    needs: [test, deploy-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: services/edge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.test.outputs.resolved-sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/edge/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      # No CLOUDFLARE_* GitHub Actions secret exists (verified via `gh secret
      # list` — SCRUM-3907). `cloudflare-api-token` already lives in Secret
      # Manager (project arkova1); read it here instead of provisioning a
      # second copy of the same credential in a second secret store.
      # `::add-mask::` registers the value with the Actions log redactor
      # BEFORE it is echoed into $GITHUB_ENV, so it never appears in plain
      # text in the run log even on a failed/verbose step.
      #
      # `tr -d '\r\n'` strips any stray trailing CR/LF from the secret
      # payload before it is ever used. Not confirmed to be the cause of the
      # 2026-09-14 verify-step failure (a local repro of this exact capture
      # found no embedded CR/LF), but it is harmless either way and a
      # malformed `Authorization: Bearer <token>\r` header is exactly the
      # class of bug this class of defensive strip exists to rule out.
      - name: Read Cloudflare API token from Secret Manager
        run: |
          set -euo pipefail
          TOKEN="$(gcloud secrets versions access latest --secret=cloudflare-api-token --project="${PROJECT_ID}" | tr -d '\r\n')"
          if [ -z "${TOKEN}" ]; then
            echo "::error::cloudflare-api-token secret in Secret Manager (project ${PROJECT_ID}) returned an empty value."
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          echo "CLOUDFLARE_API_TOKEN=${TOKEN}" >> "$GITHUB_ENV"

      # The 2026-09-08 manual deploy failed partway through on a Cloudflare
      # API token with too-narrow route-edit scope — a class of failure that
      # otherwise only surfaces deep inside `wrangler deploy`'s own error
      # output. Fail fast, before touching wrangler at all, with a message
      # that names what to fix. LIMITATION (stated, not hidden): Cloudflare's
      # `/user/tokens/verify` endpoint confirms the token is well-formed and
      # `active` — it does NOT enumerate the token's permission groups (that
      # requires Account:Read/Token-introspection access the deploy token may
      # itself lack). This step can prove "the token is dead" but cannot
      # prove "the token has route-edit scope"; a scope-too-narrow failure
      # can still surface later, inside `wrangler deploy` itself. Required
      # permission groups for this token (document kept in sync with
      # services/edge/agents.md and the Confluence runbook): Workers
      # Scripts:Edit, Workers Routes:Edit, Workers KV Storage:Edit, Zone:Read
      # on arkova.ai.
      #
      # DIAGNOSTIC FIX (2026-09-14, SCRUM-3907 incident): the previous form
      # of this step (`RESP="$(curl -fsS ... || true)"` then parsed as JSON)
      # could not tell a 4xx from Cloudflare/an intermediary returning a
      # non-JSON 200 apart — both curl's `-f` (which prints NO body on an
      # HTTP error and just exits nonzero, swallowed by `|| true`) and a
      # JSON-parse failure on a non-JSON body collapse to the same empty
      # string, reported as the unhelpful `<unparseable response>`.
      #
      # ROOT CAUSE FOUND while building this fix, and it is NOT a token or
      # network problem: `"${RESP:-{}}"` is a bash parsing hazard. When the
      # default-value branch of `${VAR:-word}` is itself the literal `{}`,
      # bash's brace matching for the SURROUNDING `${...}` gets confused by
      # the nested `{`/`}` in `word` and appends a stray extra `}` to the
      # expansion -- for ANY value of RESP, not only when it is empty.
      # Reproduced directly: `BODY='{"result":{"status":"active"}}'; echo
      # "${BODY:-{}}"` prints the body with an extra trailing `}`, which
      # JSON.parse correctly rejects as a syntax error -- caught by the
      # `try{}catch{}` and reported as empty status, i.e. exactly
      # `<unparseable response>`. This means the ORIGINAL step could never
      # have succeeded against any real Cloudflare response, valid token or
      # not; the two live dispatches on 2026-09-14 (both `<unparseable
      # response>`, both against a token independently confirmed active by
      # two different people from two different shells) are fully explained
      # by this alone. Fixed by never using a brace-shaped default inside
      # `${...}` -- an explicit `if`/empty-string default sidesteps the
      # parser hazard entirely (verified: preserves a real body exactly,
      # defaults a genuinely empty one to `{}`).
      #
      # Separately, real HTTP-level failures (bad token, network/WAF issue)
      # are now distinguishable too: the HTTP status code and body are
      # captured SEPARATELY (`-w`/`-o`, no `-f`) instead of curl silently
      # discarding the body on any non-2xx. The body is Cloudflare's own
      # response describing the token's status — never the token itself —
      # so it is safe to print in full; it is truncated only to keep the
      # log line reasonable.
      - name: Verify Cloudflare API token is active
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl -sS --max-time 10 -o /tmp/cf_verify_body.json -w '%{http_code}' \
            -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" || echo "000")"
          BODY="$(cat /tmp/cf_verify_body.json 2>/dev/null || true)"
          if [ -z "${BODY:-}" ]; then BODY='{}'; fi
          STATUS="$(node -e 'try{const b=JSON.parse(process.argv[1]);process.stdout.write(String(b?.result?.status||""))}catch{process.stdout.write("")}' "$BODY")"
          if [ "${STATUS}" != "active" ]; then
            BODY_PREVIEW="$(printf '%s' "${BODY}" | head -c 300)"
            echo "::error::Cloudflare API token verify failed (http_code=${HTTP_CODE}, status='${STATUS:-<unparseable>}', body='${BODY_PREVIEW}'). The token in Secret Manager (cloudflare-api-token, project ${PROJECT_ID}) is missing, expired, or revoked — OR the request was rejected/altered before reaching the verify endpoint (e.g. a non-2xx from Cloudflare or an intermediary). If http_code is 2xx with an unparseable body, this is NOT a bad-token signal; investigate the runner-to-Cloudflare network path instead of rotating the token. If the token genuinely needs replacing: regenerate it in the Cloudflare dashboard with these permission groups: Workers Scripts:Edit, Workers Routes:Edit, Workers KV Storage:Edit, Zone:Read (scoped to arkova.ai) — then update the Secret Manager value. Note: a token that verifies 'active' here can still lack route-edit scope; this check cannot enumerate permission groups (see the workflow comment above this step)."
            exit 1
          fi
          echo "✅ Cloudflare API token verify: status=active."

      - name: Generate build-info
        run: node scripts/generate-build-info.mjs "${{ needs.test.outputs.resolved-sha }}"

      # Records what edge.arkova.ai was serving BEFORE this deploy, for the
      # run log — the live bundle's actual state (including whether the
      # ES256 verifier fix was already live) has been unverified for months,
      # so the first real run through this pipeline should document its
      # before-state rather than silently overwrite it with no record.
      - name: Record pre-deploy live identity
        run: |
          set -euo pipefail
          BODY="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://edge.arkova.ai/health?cb=predeploy-${{ github.run_id }}" || true)"
          PRE_SHA="$(node -e 'try{const b=JSON.parse(process.argv[1]);process.stdout.write(String(b.git_sha||""))}catch{process.stdout.write("")}' "${BODY:-{}}")"
          if [ -z "${PRE_SHA}" ]; then
            echo "Pre-deploy edge.arkova.ai/health: no version identity (pre-workflow build) — response: ${BODY:-<unreachable>}"
          else
            echo "Pre-deploy edge.arkova.ai/health reports git_sha=${PRE_SHA}"
          fi

      # SonarCloud githubactions:S6505/S8543 -- see the `--dry-run` step's
        # comment above; same fix, same pinned version (keep in sync with
        # package.json's `wrangler` devDependency).
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install wrangler@4.130.0 deploy

      # Deployed-version parity check (SCRUM-3907's actual "never again"
      # mechanism): a `wrangler deploy` exit 0 only proves the Cloudflare API
      # accepted the upload — it does NOT prove edge.arkova.ai is serving it
      # (propagation lag, a route misconfiguration, a stale KV-bound
      # environment, or a CDN/cache layer serving a pre-deploy snapshot).
      # Curl the live endpoint with a cache-busting query param + no-cache
      # header and assert its self-reported git_sha equals the commit this
      # job just deployed; fail the job if not. Retries up to 5 times across
      # roughly 60s (4 x 15s waits) to absorb propagation lag without
      # mistaking it for a real failure.
      - name: Verify deployed-version parity
        env:
          EXPECTED_SHA: ${{ needs.test.outputs.resolved-sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            BODY="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://edge.arkova.ai/health?cb=postdeploy-${{ github.run_id }}-${attempt}" || true)"
            LIVE_SHA="$(node -e 'try{const b=JSON.parse(process.argv[1]);process.stdout.write(String(b.git_sha||""))}catch{process.stdout.write("")}' "${BODY:-{}}")"
            if [ "${LIVE_SHA}" = "${EXPECTED_SHA}" ]; then
              echo "✅ edge.arkova.ai/health reports git_sha=${LIVE_SHA} — matches deployed commit."
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              echo "Attempt ${attempt}/5: live git_sha='${LIVE_SHA}', expected '${EXPECTED_SHA}' — retrying in 15s (propagation lag / cache, ~60s total window)..."
              sleep 15
            fi
          done
          echo "::error::Deployed-version parity check FAILED — edge.arkova.ai/health git_sha ('${LIVE_SHA}') does not match the commit this job deployed ('${EXPECTED_SHA}') after 5 attempts over ~60s. wrangler deploy exited 0 but the live edge is not serving this commit — this is exactly the merged-but-undeployed failure mode SCRUM-3907 exists to catch. Do not assume the deploy succeeded; investigate before re-running."
          exit 1
