name: Deploy Worker

on:
  push:
    branches: [main]
    # Markdown under services/worker/ is documentation, never shipped code
    # (agents.md, agents-changelog.md, READMEs). Without the exclusion below, a
    # docs-only commit triggers a full production deploy — exactly what happened
    # on 2026-08-01: the agents.md remediation commit 0646efd5a fired deploy run
    # 30707053737 while DEPLOY_WORKER_PAUSED=false.
    #
    # This MUST be a `!` negation inside `paths`, not a separate `paths-ignore`
    # key: GitHub does not support both filters on the same event, and defining
    # them together makes the trigger behave unpredictably rather than failing
    # loudly. Negations are evaluated in order, last match wins — so a push
    # touching any non-.md file under services/worker/ still deploys, including
    # a mixed push that also edits .md.
    paths:
      - 'services/worker/**'
      - '.github/workflows/deploy-worker.yml'
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      # BREAK-GLASS (operator-only): skip ONLY the Trivy image-scan step when a
      # transient scanner-infra outage (e.g. a Trivy/GHCR vuln-DB
      # `TOOMANYREQUESTS` rate-limit) wedges every deploy — including incident
      # hotfixes. The deploy itself still runs; the scan is the only thing
      # skipped, and the bypass is logged with the actor (see the
      # "Audit image-scan bypass" step). Defaults false: never bypassable by
      # default, and `workflow_dispatch` inputs come only from an authorized
      # actor manually dispatching the run — never from untrusted PR input.
      # This is a RUNTIME escape for a wedged scanner, NOT a label to weaken the
      # gate config (severity / fixable / pinning stay non-overridable, enforced
      # by scripts/ci/check-image-scan-gate.ts).
      bypass_image_scan:
        description: 'BREAK-GLASS: skip the Trivy image scan (scanner-infra outage only — logged)'
        type: boolean
        default: false

concurrency:
  group: deploy-worker
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# DEPLOY PAUSE (2026-08 launch wave, CTO ruling 2026-07-28)
# ---------------------------------------------------------------------------
# `deploy-worker.yml` triggers on every push to `main` touching
# `services/worker/**`. During the wave-merge window (see
# docs/release/wave-merge-choreography-2026-08.md) T2/T3 worker + migration
# PRs are being merged BEFORE the 72h soak, not after — the deliberate
# merge-before-soak sequencing CTO ruled on 2026-07-28. Left ungated, that
# means every one of those merges auto-deploys unsoaked chain/billing/
# migration code straight to prod Cloud Run.
#
# `vars.DEPLOY_WORKER_PAUSED` (a repository Actions **variable**, not a
# secret — Settings -> Secrets and variables -> Actions -> Variables) gates
# ONLY the `deploy` job's actual Cloud Run deploy path. It does NOT touch
# `pre-deploy-checks` (typecheck/lint/zk-artifacts/test/copy-lint) — those
# quality gates keep running and keep failing loudly on every push,
# paused or not, so regressions are still caught in real time.
#
#   - Default (variable unset or any value other than the literal string
#     "true"): unpaused, normal auto-deploy — this is the fail-open-to-normal
#     state, so nobody has to remember to unpause after a routine merge.
#   - `DEPLOY_WORKER_PAUSED=true`: the `deploy-gate` job below emits a
#     `::warning::` annotation + a job-summary banner on EVERY push-triggered
#     run while paused (so a paused deploy is loud, not silently skipped),
#     then the `deploy` job is skipped entirely (build/test steps already
#     ran and already reported red/green independently).
#   - `workflow_dispatch` (Actions tab -> Deploy Worker -> Run workflow, or
#     `gh workflow run deploy-worker.yml`) ALWAYS bypasses the pause — a
#     human explicitly dispatching this workflow is by definition an
#     intentional deploy, paused or not. This is the "still enable an
#     intentional deploy" escape hatch.
#
# Reversal: `gh variable set DEPLOY_WORKER_PAUSED --body false` (or delete
# it: `gh variable delete DEPLOY_WORKER_PAUSED`) un-pauses immediately for
# the next push — no code change, no PR, no redeploy of this workflow file.
# Documented in docs/release/wave-merge-choreography-2026-08.md and
# .github/workflows/agents.md.
# ---------------------------------------------------------------------------

env:
  PROJECT_ID: arkova1
  REGION: us-central1
  SERVICE_NAME: arkova-worker
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: arkova-worker-images

jobs:
  pre-deploy-checks:
    name: Pre-deploy Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Worker acceptance tests verify immutable release ancestry and need
          # the same complete Git object graph provided by the main CI suite.
          fetch-depth: 0
          # Worker tests execute repository code; do not leave the Actions
          # credential in the checkout's local Git configuration.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 20
          cache: npm
          # Cache both root and worker lockfiles — root deps (tsx) are
          # required for the `Copy lint` step, which runs the repo-root
          # script `scripts/check-copy-terms.ts`.
          cache-dependency-path: |
            package-lock.json
            services/worker/package-lock.json

      - name: Install worker dependencies
        working-directory: services/worker
        run: npm ci --ignore-scripts

      - name: Typecheck
        working-directory: services/worker
        # Use the locally-installed compiler (from `npm ci` above), not `npx`,
        # so no package is fetched/run on-demand at deploy time (SonarCloud
        # githubactions:S6505 / S8543 — pinned, no unverified on-demand install).
        run: node_modules/.bin/tsc --noEmit

      - name: Lint
        working-directory: services/worker
        # SCRUM-1250 (R0-4): use `npm run lint` so the deploy gate consumes
        # the exact same eslint invocation as services/worker/package.json#lint
        # — which is what CI's typecheck-lint job runs. Previously this was an
        # inlined `npx eslint src/ --max-warnings 0` that drifted from the
        # worker's `'warn'` rule defaults, causing every push since SCRUM-1227
        # landed (2026-04-25 02:54) to fail deploy on pre-existing warnings.
        # Followup R4 story tracks driving the warning count to zero.
        run: npm run lint

      # Cache the compiled zk circuit artifacts (~30 MB) keyed on circuit
      # source + circomlib version + build script. Cache hit skips the
      # ~30s circom compile + plonk setup; cache miss rebuilds from source.
      # Mirrors ci.yml so the deploy gate has the same artifacts available
      # to `npm test` as ci.yml does — without this, src/ai/zk-proof.test.ts
      # throws at module load and blocks every deploy. PR #693 added the
      # circuit build to ci.yml + dropped the conditional skip in the test
      # but missed deploy-worker.yml; this restores parity.
      - name: Cache zk circuit artifacts
        id: cache-zk-artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: services/worker/circuits/artifacts
          key: zk-artifacts-${{ runner.os }}-circom2.1.9-${{ hashFiles('services/worker/circuits/extraction-proof.circom', 'services/worker/circuits/build.sh', 'services/worker/package-lock.json') }}

      - name: Install circom (cache miss only)
        if: steps.cache-zk-artifacts.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          CIRCOM_VERSION=v2.1.9
          mkdir -p "$HOME/.local/bin"
          # --proto '=https' --tlsv1.2: refuse any non-HTTPS redirect so the
          # binary can only come over TLS (SonarCloud githubactions:S6506); the
          # download is additionally sha256-verified on the next line.
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 -o "$HOME/.local/bin/circom" \
            "https://github.com/iden3/circom/releases/download/${CIRCOM_VERSION}/circom-linux-amd64"
          echo "e5575829252d763b7818049df9de2ef9304df834697de77fa63ce7babc23c967  $HOME/.local/bin/circom" | sha256sum -c -
          chmod +x "$HOME/.local/bin/circom"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build zk circuit artifacts (cache miss only)
        if: steps.cache-zk-artifacts.outputs.cache-hit != 'true'
        working-directory: services/worker
        run: npm run build:circuit

      - name: Verify zk circuit artifacts present
        run: |
          ls -lh services/worker/circuits/artifacts/extraction-proof_js/extraction-proof.wasm
          ls -lh services/worker/circuits/artifacts/extraction-proof_final.zkey
          ls -lh services/worker/circuits/artifacts/verification_key.json

      - name: Test
        working-directory: services/worker
        run: npm test

      - name: Install root dependencies (for lint:copy)
        # `lint:copy` runs from the repo root and shells out to `tsx`,
        # which lives in root devDependencies. Without this step the
        # deploy gate fails with `sh: 1: tsx: not found` (exit 127).
        # Mirrors ci.yml which installs root deps before invoking the
        # same script. Drift between the two caused every push to main
        # since 2026-04-26 11:45 UTC to fail the deploy gate.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Copy lint
        run: npm run lint:copy

  deploy-gate:
    name: Deploy Gate (pause check)
    needs: pre-deploy-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Evaluate DEPLOY_WORKER_PAUSED
        id: check
        env:
          PAUSED: ${{ vars.DEPLOY_WORKER_PAUSED }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # workflow_dispatch is always a human deliberately asking for a
          # deploy right now — the pause never applies to it, regardless of
          # DEPLOY_WORKER_PAUSED's value. This is the intentional-override path.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Manual workflow_dispatch by ${ACTOR} — deploy proceeds regardless of DEPLOY_WORKER_PAUSED (intentional-override path)."
            exit 0
          fi

          if [ "$PAUSED" = "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### :no_entry: DEPLOY PAUSED — Cloud Run deploy skipped for this push"
              echo
              echo "\`vars.DEPLOY_WORKER_PAUSED=true\`. Commit \`${SHA}\` passed \`pre-deploy-checks\` (typecheck/lint/test/copy-lint all ran normally) but the \`deploy\` job's Cloud Run steps were **not executed**."
              echo
              echo "**Why:** 2026-08 launch wave merge-before-soak sequencing (CTO ruling 2026-07-28) — see \`docs/release/wave-merge-choreography-2026-08.md\`."
              echo
              echo "**To deploy this commit anyway (human, intentional):** Actions tab -> Deploy Worker -> Run workflow (or \`gh workflow run deploy-worker.yml\`). \`workflow_dispatch\` always bypasses this pause."
              echo
              echo "**To resume automatic deploys for all future pushes:** \`gh variable set DEPLOY_WORKER_PAUSED --body false\` or \`gh variable delete DEPLOY_WORKER_PAUSED\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::DEPLOY PAUSED (vars.DEPLOY_WORKER_PAUSED=true) — Cloud Run deploy SKIPPED for commit ${SHA}. See job summary for why + how to re-enable/override."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build & Deploy (canary → full)
    needs: deploy-gate
    if: needs.deploy-gate.result == 'success' && needs.deploy-gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build image
        id: build
        run: |
          # Build on the runner instead of Cloud Build. GitHub's WIF principal
          # can push to Artifact Registry, but `gcloud builds submit` requires
          # source-upload access to the project Cloud Build bucket and has
          # repeatedly failed before a build can start.
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          LATEST="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest"
          docker build \
            --build-arg BUILD_SHA="${{ github.sha }}" \
            --tag "${IMAGE}" \
            --tag "${LATEST}" \
            services/worker
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"

      # BREAK-GLASS audit trail: if an operator manually dispatched this deploy
      # with `bypass_image_scan=true`, record WHO bypassed the scan and WHY the
      # escape exists, so every use is traceable in the run log. This step only
      # runs when the bypass is active; the scan step below is skipped by the
      # same condition. The deploy still proceeds — only the scan is skipped.
      - name: Audit image-scan bypass (break-glass)
        if: github.event.inputs.bypass_image_scan == 'true'
        run: |
          echo "⚠️ image scan bypassed by ${{ github.actor }}"
          echo "Reason: operator break-glass for a Trivy/GHCR scanner-infra outage."
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # TVM/IVS (CSA STAR CAIQ): scan the built worker image for OS-layer /
      # base-image CVEs BEFORE it is pushed or deployed. sonatype-scan.yml
      # covers the npm dependency graph; this closes the base-image / OS-package
      # gap flagged in the CAIQ self-assessment. Scanning before push means a
      # vulnerable image never reaches Artifact Registry or Cloud Run. Fails the
      # deploy on FIXABLE HIGH/CRITICAL OS CVEs (mirrors the CVSS>=7 fixable gate
      # in sonatype-scan.yml). `ignore-unfixed: true` tracks — does not gate on —
      # CVEs with no upstream patch, so an unpatchable base-image CVE cannot
      # wedge every deploy. `vuln-type: os` keeps library CVEs in sonatype's lane
      # (no double-gating). NOTE: `vuln-type` is the SUPPORTED input at the pinned
      # action SHA — `pkg-types` is only a placeholder rename in the action's repo,
      # NOT a real input yet; passing it fails with "Unexpected input(s)" and the action
      # falls back to scanning `os,library` (gating library CVEs → blocked every
      # prod deploy on 2026-06-22, run 27969852143). Re-evaluate only when the
      # pinned action version actually ships `pkg-types`. Control doc:
      # docs/compliance/container-image-scanning.md. Invariant enforced at PR time
      # by scripts/ci/check-image-scan-gate.ts.
      #
      # DB-fetch hardening (so a transient vuln-DB outage doesn't wedge deploys):
      #   - `cache: true` reuses the Trivy DB across runs (fewer cold pulls);
      #   - `github-pat` makes GHCR DB pulls authenticated (higher rate limit) —
      #     this is the action's supported input name; `github-token` is NOT a
      #     valid input at the pinned SHA (it was silently ignored);
      #   - `TRIVY_DB_REPOSITORY` / `TRIVY_JAVA_DB_REPOSITORY` pull the DBs from
      #     the public ECR mirror instead of the shared ghcr.io pool that is the
      #     usual source of `TOOMANYREQUESTS`;
      #   - `timeout-minutes` fails fast if a fetch hangs instead of burning the
      #     full job timeout.
      # If the scanner infra is hard-down, an operator can still ship via the
      # `bypass_image_scan` break-glass above (manual workflow_dispatch, logged).
      - name: Scan image for base-image CVEs (Trivy)
        if: github.event.inputs.bypass_image_scan != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        timeout-minutes: 10
        env:
          # Escape the shared ghcr.io pool (the usual TOOMANYREQUESTS source).
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
        with:
          image-ref: ${{ steps.build.outputs.image }}
          scan-type: image
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          # Reuse the vuln DB across runs + authenticate GHCR pulls so a
          # transient rate-limit doesn't fail the scan and block every deploy.
          cache: true
          github-pat: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          set -euo pipefail
          docker push "${{ steps.build.outputs.image }}"
          docker push "${{ steps.build.outputs.latest }}"

      - name: Clear conflicting env/secret types
        # This step exists because a name that currently exists as one TYPE
        # (env var vs secret) cannot be re-declared as the other in the same
        # `gcloud run deploy` — gcloud rejects the pair. Clearing first lets
        # the canary deploy below set them authoritatively.
        #
        # `--no-traffic` is LOAD-BEARING, not cosmetic (live incident
        # 2026-08-01, contract-pinned in
        # scripts/ci/deploy-worker-history-contract.test.ts).
        # `gcloud run services update` CREATES A REVISION, and the promote
        # step at the bottom of this job leaves the service pinned
        # `--to-latest` — a persistent service setting, not a one-shot. So
        # without `--no-traffic` this step instantly moves 100% of prod onto a
        # revision with the DocuSign/CRON names stripped: prod caught on
        # `arkova-worker-00892-jd2` with 50 env vars against the canary's 57,
        # DocuSign Connect webhook answering 503 `integration_disabled`. It
        # self-heals on promote, so it looks harmless — until the canary
        # deploy, the image scan, the smoke test, or the run itself fails in
        # between, and prod stays DocuSign-blind indefinitely with nothing
        # alarming on it.
        #
        # With `--no-traffic`, this revision is created but never served, and
        # traffic stays pinned to the last good revision until `Promote canary
        # to full traffic` moves it deliberately. A failure anywhere in
        # between now leaves prod on fully-configured code, which is the
        # correct direction to fail.
        run: |
          # Non-fatal BY DESIGN: clearing a name that is not currently set is a
          # no-op, not an error, so this step must not fail the deploy.
          #
          # But stderr is NOT discarded. The previous `2>/dev/null || true` made
          # a genuine rejection (an unsupported flag, missing IAM, a bad service
          # name) indistinguishable from "nothing to clear" — the clear would
          # silently not happen and the only symptom would surface later as an
          # apparently-unrelated env/secret type conflict in the canary deploy.
          # Capture the output and surface it as a warning instead.
          set +e
          CLEAR_OUT=$(gcloud run services update ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --no-traffic \
            --remove-secrets CRON_SECRET,DOCUSIGN_INTEGRATION_KEY,DOCUSIGN_CLIENT_SECRET,DOCUSIGN_CONNECT_HMAC_SECRET \
            --remove-env-vars CRON_SECRET,DOCUSIGN_INTEGRATION_KEY,DOCUSIGN_CLIENT_SECRET,DOCUSIGN_CONNECT_HMAC_SECRET,ENABLE_DOCUSIGN_OAUTH,ENABLE_DOCUSIGN_WEBHOOK,DOCUSIGN_DEMO \
            --quiet 2>&1)
          CLEAR_RC=$?
          set -e
          printf '%s\n' "${CLEAR_OUT}"
          if [ "${CLEAR_RC}" -ne 0 ]; then
            echo "::warning title=Clear conflicting env/secret types exited ${CLEAR_RC}::The clear step did not succeed. If the canary deploy below fails with an env/secret type conflict, this is why. Output above."
          fi

      # GH #1835/#1836/#1837 activation (2026-08-03): PR #1944 already merged the
      # three code fixes (channel-token secret instead of the org UUID, the
      # lease-guarded renewal job, folder_path population) but left the
      # connector fully dark — ENABLE_DRIVE_OAUTH / ENABLE_DRIVE_WEBHOOK /
      # ENABLE_DRIVE_CHANGES_RUNNER were never added here, so nobody could
      # connect Drive, no push notification could reach the webhook, and no
      # received push would be processed. All three flipped true below.
      # Boot-time config validation (config.ts) for ENABLE_DRIVE_OAUTH=true in
      # production requires GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET,
      # INTEGRATION_STATE_HMAC_SECRET (all three already in --set-secrets below)
      # and GCP_KMS_INTEGRATION_TOKEN_KEY (already in --set-env-vars below) —
      # verified present before flipping the flag so this canary cannot
      # crash-loop the whole worker on a missing-secret Zod validation error.
      # ENABLE_DRIVE_CHANGES_RUNNER fails soft (skips + logs, never throws) on
      # an integration with no last_page_token per drive-changes-runner.ts —
      # safe for a from-zero activation where ENABLE_DRIVE_OAUTH has been off
      # this whole time, so there are no pre-existing connections to strand.
      #
      # DELIBERATELY NOT added: ENABLE_WORKSPACE_RENEWAL. It does not gate the
      # renewal job above (routes/cron.ts's POST /jobs/drive-subscription-renewal
      # and routes/scheduled.ts's in-process backup both call
      # runDriveSubscriptionRenewal() unconditionally — protected by a run
      # lease, not a feature flag). ENABLE_WORKSPACE_RENEWAL instead gates a
      # DIFFERENT, unrelated job (workspace-subscription-renewal.ts, SCRUM-1147)
      # whose driveRenew/graphRenew deps are hardcoded stubs that always throw
      # "not configured" — it has no Cloud Scheduler trigger anywhere and
      # setting it true would not activate anything Drive-related. See the PR
      # body for the full trace.
      #
      # The renewal job's Cloud Scheduler job (scripts/gcp-setup/cloud-scheduler.sh,
      # `drive-subscription-renewal`) is declared but NOT applied to prod — that
      # is a separate, manual `gcloud scheduler jobs create` step (see the PR
      # body) that this workflow cannot perform. Until it runs, renewal relies
      # solely on the hourly in-process backup, which is not reliable under
      # Cloud Run CPU throttling (node-cron does not fire on a throttled
      # instance) — see the PR's Premortem.
      - name: Deploy canary (no traffic)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --platform managed \
            --port 3001 \
            --cpu 2 \
            --memory 2Gi \
            --min-instances 2 \
            --max-instances 10 \
            --timeout 3600 \
            --tag canary \
            --no-traffic \
            --set-secrets "SUPABASE_URL=supabase-url:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest,SUPABASE_JWT_SECRET=supabase-jwt-secret:latest,STRIPE_SECRET_KEY=stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest,BITCOIN_TREASURY_WIF=bitcoin-treasury-wif:latest,SENTRY_DSN=sentry-dsn:latest,API_KEY_HMAC_SECRET=api-key-hmac-secret:latest,GEMINI_API_KEY=gemini-api-key:latest,CRON_SECRET=cron-secret:latest,RESEND_API_KEY=resend-api-key:latest,TOGETHER_API_KEY=together-api-key:latest,COURTLISTENER_API_TOKEN=courtlistener-api-token:latest,OPENSTATES_API_KEY=openstates-api-key:latest,BITCOIN_RPC_URL=bitcoin-rpc-url:latest,UPSTASH_REDIS_REST_URL=UPSTASH_REDIS_REST_URL:latest,UPSTASH_REDIS_REST_TOKEN=UPSTASH_REDIS_REST_TOKEN:latest,RUNPOD_API_KEY=runpod-api-key:latest,EDGAR_USER_AGENT=edgar-user-agent:latest,SAM_GOV_API_KEY=sam-gov-api-key:latest,CLOUDFLARE_API_TOKEN=cloudflare-api-token:latest,CLOUDFLARE_TUNNEL_TOKEN=cloudflare-tunnel-token:latest,GOOGLE_OAUTH_CLIENT_ID=google-oauth-client-id:latest,GOOGLE_OAUTH_CLIENT_SECRET=google-oauth-client-secret:latest,DOCUSIGN_INTEGRATION_KEY=docusign_integration_key:latest,DOCUSIGN_CLIENT_SECRET=docusign_secretkey_prod:latest,DOCUSIGN_CONNECT_HMAC_SECRET=docusign_connect_hmac_secret_prod:latest,INTEGRATION_STATE_HMAC_SECRET=INTEGRATION_STATE_HMAC_SECRET:latest,HEALTH_DETAIL_TOKEN=HEALTH_DETAIL_TOKEN:latest,IP_HASH_PEPPER=ip-hash-pepper:latest" \
            --set-env-vars "^||^NODE_ENV=production||LOG_LEVEL=info||BITCOIN_NETWORK=mainnet||ENABLE_PROD_NETWORK_ANCHORING=true||USE_MOCKS=false||FRONTEND_URL=https://app.arkova.ai||CORS_ALLOWED_ORIGINS=https://app.arkova.ai,https://arkova-carson.vercel.app,https://arkova-26.vercel.app||AI_PROVIDER=gemini||GEMINI_MODEL=gemini-2.5-flash||GEMINI_LITE_MODEL=gemini-2.5-flash||ENABLE_AI_EXTRACTION=true||ENABLE_SEMANTIC_SEARCH=true||ENABLE_AI_FRAUD=true||ENABLE_AI_REPORTS=true||CRON_OIDC_AUDIENCE=https://arkova-worker-270018525501.us-central1.run.app||KMS_PROVIDER=gcp||GCP_KMS_KEY_RESOURCE_NAME=projects/arkova1/locations/global/keyRings/arkova-signing/cryptoKeys/bitcoin-mainnet/cryptoKeyVersions/1||GCP_KMS_INTEGRATION_TOKEN_KEY=projects/arkova1/locations/global/keyRings/arkova-signing/cryptoKeys/integration-tokens||ENABLE_VERIFICATION_API=true||BATCH_ANCHOR_MAX_SIZE=10000||X402_FACILITATOR_URL=https://edge.arkova.ai/x402/verify||X402_NETWORK=eip155:84532||BITCOIN_UTXO_PROVIDER=getblock||BITCOIN_FEE_STRATEGY=mempool||ENABLE_DOCUSIGN_OAUTH=true||ENABLE_DOCUSIGN_WEBHOOK=true||DOCUSIGN_DEMO=false||ENABLE_DRIVE_OAUTH=true||ENABLE_DRIVE_WEBHOOK=true||ENABLE_DRIVE_CHANGES_RUNNER=true||ENABLE_CONNECTOR_ARTIFACT_ENQUEUE=true||ENABLE_CONNECTOR_ARTIFACT_DRAIN=true||WORKER_PUBLIC_URL=https://arkova-worker-270018525501.us-central1.run.app||EMAIL_FROM=noreply@arkova.ai||TOGETHER_MODEL=carson_6cec/Meta-Llama-3.1-8B-Instruct-Reference-arkova-nessie-e3cda031" \
            --quiet

      - name: Smoke test canary revision
        # Two bugs in the original implementation (introduced 2026-04-25 in
        # adc654d2) caused this step to never actually exercise the canary:
        #   1. `--format='value(status.traffic[tag=canary].url)'` returned empty
        #      because gcloud's `value()` projection does not support
        #      tag-filter subscripts on arrays. The script then fell back to
        #      the main service URL — which routes to whatever has live
        #      traffic, NOT the new no-traffic canary.
        #   2. The assertion `.status == "ok"` never matched. /health returns
        #      `{"status": "healthy" | "degraded"}` (services/worker/src/
        #      routes/health.ts:212). It has never returned "ok".
        # Together these caused the deploy of PR #584 (sha ebd42e00) to fail
        # smoke test against live (healthy) prod, blocking the unblock that
        # PR was meant to deliver.
        # Fix: extract the canary tag URL via --format=json + jq, fail fast
        # if absent (don't silently retest live), and assert the actual
        # contract (`status: healthy`).
        run: |
          CANARY_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format=json \
            | jq -r '.status.traffic[]? | select(.tag=="canary") | .url')
          if [ -z "$CANARY_URL" ] || [ "$CANARY_URL" = "null" ]; then
            echo "ERROR: canary tag URL not found on service. Refusing to fall back to live URL."
            gcloud run services describe ${{ env.SERVICE_NAME }} \
              --region=${{ env.REGION }} \
              --project=${{ env.PROJECT_ID }} \
              --format=json | jq '.status.traffic' || true
            exit 1
          fi
          echo "Canary URL: ${CANARY_URL}"
          for i in 1 2 3; do
            BODY=$(curl -sf --max-time 10 "${CANARY_URL}/health" || echo "")
            if [ -n "$BODY" ] && echo "$BODY" | jq -e '.status == "healthy"' >/dev/null; then
              echo "Canary health check passed (attempt $i)"
              echo "Response: $BODY"
              exit 0
            fi
            echo "Canary health check attempt $i failed (body: ${BODY:-<empty>}), retrying in 5s..."
            sleep 5
          done
          echo "Canary health check failed after 3 attempts — aborting deploy"
          exit 1

      - name: Promote canary to full traffic
        run: |
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --to-latest \
            --quiet

      - name: Verify deployment health
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "Service URL: ${URL}"
          echo "Checking health endpoint..."
          curl -sf "${URL}/health" | jq .

      # Runtime backstop for the 2026-08-01 incident. The contract tests in
      # scripts/ci/deploy-worker-history-contract.test.ts pin the workflow
      # SHAPE (clear is --no-traffic, traffic moves once, everything cleared is
      # re-set); this asserts the OUTCOME on the revision actually taking
      # traffic, so a gcloud behaviour change or a hand-run `gcloud run
      # services update` cannot leave prod configured-blind in silence.
      # Deliberately after the promote: it is an alarm, not a gate — the point
      # is that a stripped prod can never again be invisible.
      - name: Verify serving revision carries required config
        run: |
          set -euo pipefail
          SERVING=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format=json | jq -r '[.status.traffic[]? | select((.percent // 0) > 0) | .revisionName] | first // empty')
          if [ -z "${SERVING}" ]; then
            echo "::error::Could not determine the revision serving traffic."
            exit 1
          fi
          echo "Serving revision: ${SERVING}"
          NAMES=$(gcloud run revisions describe "${SERVING}" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format=json \
            | jq -r '[.spec.containers[0].env[]?.name] | sort | join(" ")')
          MISSING=""
          for required in CRON_SECRET DOCUSIGN_INTEGRATION_KEY DOCUSIGN_CLIENT_SECRET \
                          DOCUSIGN_CONNECT_HMAC_SECRET ENABLE_DOCUSIGN_OAUTH \
                          ENABLE_DOCUSIGN_WEBHOOK DOCUSIGN_DEMO \
                          ENABLE_CONNECTOR_ARTIFACT_DRAIN; do
            case " ${NAMES} " in
              *" ${required} "*) ;;
              *) MISSING="${MISSING} ${required}";;
            esac
          done
          if [ -n "${MISSING}" ]; then
            echo "::error title=Serving revision is missing required config::${SERVING} does not carry:${MISSING}. This is the 2026-08-01 failure mode (prod served a post-clear revision with DocuSign env stripped; the Connect webhook answered 503 integration_disabled). Check that the clear step is still --no-traffic and that the canary deploy re-sets every cleared name."
            exit 1
          fi
          echo "Serving revision carries all required config names."
