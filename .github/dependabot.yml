# Dependabot configuration — SCRUM-508
# Automated dependency update PRs for security and maintenance
version: 2
updates:
  # Root package (frontend + shared)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"
    # Group minor/patch updates to reduce PR noise
    groups:
      production-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Worker service
  - package-ecosystem: "npm"
    directory: "/services/worker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "worker"
    commit-message:
      prefix: "chore(deps-worker):"
    groups:
      worker-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # stripe API-version pin is a manual billing-reviewed upgrade — see CEO
      # decision 2026-06-29 (CONDITIONAL-GO sub-decision A). stripe >=22.3.0
      # repins the SDK apiVersion type (2026-06-24.dahlia), which breaks the
      # worker's hardcoded apiVersion (src/stripe/client.ts) at build time.
      # Bumping stripe must be a deliberate, human-driven PR that also moves the
      # pinned apiVersion — never an auto-grouped Dependabot bump.
      - dependency-name: "stripe"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

      # undici major-version ignore REMOVED (was here 2026-08-11 -> 2026-08-20,
      # SCRUM-3166 / GH #2188): it existed only because the worker Dockerfile ran
      # node:20-alpine and undici 8.x requires Node >=22.19.0. The worker now
      # runs node:22-alpine (both stages) with `engines.node >=22.19.0` in this
      # package's manifest, so the Node-version trap this ignore guarded against
      # no longer applies. See #2188 for the original incident (PR #2091 ->
      # #2186 revert) and the chore(runtime) PR that removed this entry for the
      # follow-up verification a fresh undici 8 bump should get.

  # Edge service
  - package-ecosystem: "npm"
    directory: "/services/edge"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "edge"
    commit-message:
      prefix: "chore(deps-edge):"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci):"
