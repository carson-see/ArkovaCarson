# Dependabot configuration — SCRUM-508
# Automated dependency update PRs for security and maintenance
version: 2
updates:
  # Root package (frontend + shared)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"
    # Group minor/patch updates to reduce PR noise
    groups:
      production-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Worker service
  - package-ecosystem: "npm"
    directory: "/services/worker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "worker"
    commit-message:
      prefix: "chore(deps-worker):"
    groups:
      worker-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # stripe API-version pin is a manual billing-reviewed upgrade — see CEO
      # decision 2026-06-29 (CONDITIONAL-GO sub-decision A). stripe >=22.3.0
      # repins the SDK apiVersion type (2026-06-24.dahlia), which breaks the
      # worker's hardcoded apiVersion (src/stripe/client.ts) at build time.
      # Bumping stripe must be a deliberate, human-driven PR that also moves the
      # pinned apiVersion — never an auto-grouped Dependabot bump.
      - dependency-name: "stripe"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

      # undici 8.x requires Node >=22.19.0, but the worker Dockerfile runs
      # node:20-alpine in BOTH stages. Auto-bumping the major produced
      # `webidl.util.markAsUncloneable is not a function`, 31 test failures
      # across 5 suites, and an ~80-minute production deploy blackout on
      # 2026-08-11 (PR #2091 -- merged over a Tests check that had been red
      # since 14:57Z; reverted by #2186). Minor/patch bumps stay allowed.
      # Remove this ignore ONLY together with the Node 22 base-image bump,
      # tracked in issue #2188. Node 20 goes EOL 2026-04.
      - dependency-name: "undici"
        update-types:
          - "version-update:semver-major"

  # Edge service
  - package-ecosystem: "npm"
    directory: "/services/edge"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "edge"
    commit-message:
      prefix: "chore(deps-edge):"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci):"
