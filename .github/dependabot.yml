# Dependabot configuration — SCRUM-508
# Automated dependency update PRs for security and maintenance
#
# PR-budget rules (CTO decision 2026-09-21, after the Monday wave opened 13 PRs at
# once, took the repo to 20 open against the founder's 15-PR ceiling and helped
# exhaust the GitHub Actions budget the same day):
#   * The open-pull-requests-limit values below sum to 7. Keep the sum <= 7 so a
#     full Dependabot wave can never consume more than half the ceiling.
#   * Every npm entry has TWO groups: minor+patch in one PR, majors in one PR.
#     An ungrouped major is one PR per package, and worker/root bumps cannot
#     auto-merge (they need soak evidence), so they sit open for days.
#   * Schedules are staggered across the week so the required-check matrix and
#     Mergify's speculative runs are not multiplied by every ecosystem at once.
#   * These limits do not apply to Dependabot SECURITY updates, which have their
#     own limit and must keep flowing.
version: 2
updates:
  # Root package (frontend + shared)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"
    # Group minor/patch updates to reduce PR noise
    groups:
      production-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      production-deps-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"

  # Worker service
  - package-ecosystem: "npm"
    directory: "/services/worker"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "worker"
    commit-message:
      prefix: "chore(deps-worker):"
    groups:
      worker-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      worker-deps-major:
        applies-to: version-updates
        patterns:
          - "*"
        # These two must never ride a grouped PR: a stripe major moves the pinned
        # apiVersion (billing-reviewed, see the ignore block below) and
        # bitcoinjs-lib is a T3 chain/signing surface that needs its own soak.
        # Excluded packages still get their own individual PR.
        exclude-patterns:
          - "stripe"
          - "bitcoinjs-lib"
        update-types:
          - "major"
    ignore:
      # stripe API-version pin is a manual billing-reviewed upgrade — see CEO
      # decision 2026-06-29 (CONDITIONAL-GO sub-decision A). stripe >=22.3.0
      # repins the SDK apiVersion type (2026-06-24.dahlia), which breaks the
      # worker's hardcoded apiVersion (src/stripe/client.ts) at build time.
      # Bumping stripe must be a deliberate, human-driven PR that also moves the
      # pinned apiVersion — never an auto-grouped Dependabot bump.
      - dependency-name: "stripe"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

      # undici major-version ignore REMOVED (was here 2026-08-11 -> 2026-08-20,
      # SCRUM-3166 / GH #2188): it existed only because the worker Dockerfile ran
      # node:20-alpine and undici 8.x requires Node >=22.19.0. The worker now
      # runs node:22-alpine (both stages) with `engines.node >=22.19.0` in this
      # package's manifest, so the Node-version trap this ignore guarded against
      # no longer applies. See #2188 for the original incident (PR #2091 ->
      # #2186 revert) and the chore(runtime) PR that removed this entry for the
      # follow-up verification a fresh undici 8 bump should get.

  # Edge service
  - package-ecosystem: "npm"
    directory: "/services/edge"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "edge"
    commit-message:
      prefix: "chore(deps-edge):"
    # One PR for everything: the 2026-09-21 wave opened five separate edge PRs
    # (types, vitest, wrangler, workers-types, zod), each running the full
    # required-check matrix plus a Mergify speculative run.
    groups:
      edge-deps:
        applies-to: version-updates
        patterns:
          - "*"

  # Zapier integration (SCRUM-4988: Sekura Phase 2 found form-data 4.0.5 here —
  # this directory had no Dependabot coverage at all)
  - package-ecosystem: "npm"
    directory: "/integrations/zapier"
    schedule:
      interval: "weekly"
      day: "thursday"
    # Release tooling, not a runtime surface (CTO ruling 2026-09-12); limit
    # lowered 2 -> 1 on 2026-09-21 under the PR-budget rules at the top of this file.
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "zapier"
    commit-message:
      prefix: "chore(deps-zapier):"
    groups:
      zapier-deps:
        applies-to: version-updates
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci):"
