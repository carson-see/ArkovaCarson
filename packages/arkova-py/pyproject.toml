[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "arkova"
# 2.3.0 — MINOR, not PATCH. The 2.2.1 corrective release fixed the one
# crash-class drift; this one clears the rest of the same audit, and seven
# declared fields that no endpoint emits are REMOVED. Nothing can lose data
# (they read `None` on every response ever returned), but `.chain_tx_id` on a
# receipt now raises AttributeError instead of answering `None`, and that is a
# source-visible break. See CHANGELOG.md.
version = "2.3.0"
description = "Typed Python SDK for the Arkova Verification APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arkova Engineering", email = "engineering@arkova.ai" }]
keywords = ["arkova", "verification", "credentials", "anchors", "api"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  # EXACT pin, on purpose. ruff has no stable-default guarantee below 1.0:
  # 0.16.0 widened its implicit default rule set (adding I / UP / SIM / PYI /
  # BLE / RUF), which turned the publish workflow's `ruff check src tests` red
  # with 87 findings against unchanged code. The old `>=0.8,<1` range let that
  # land silently.
  #
  # A range like `>=0.16,<0.17` is NOT enough: the default set is a curated
  # ~413-rule subset, so a PATCH release can add a rule to it too. And it cannot
  # be fenced with an explicit `[tool.ruff.lint] select` either — that subset is
  # not expressible as rule prefixes (selecting the 38 prefixes it draws from
  # yields 288 findings, because it includes only parts of E, D, PTH, PLR, ...).
  # Pinning the exact version is the only way to make this gate deterministic.
  #
  # To upgrade: bump this, run `ruff check src tests`, fix any new findings in
  # the same PR.
  "ruff==0.16.0",
]

[project.urls]
Homepage = "https://arkova.ai"
Documentation = "https://arkova.ai/docs/v2"
Repository = "https://github.com/carson-see/ArkovaCarson"

[tool.hatch.build.targets.wheel]
packages = ["src/arkova"]
# agents.md is internal Claude-session engineering notes (CLAUDE.md §3 gate 5),
# not user-facing docs — keep it out of the installed wheel. It still ships in
# the sdist (source tree), just not in what `pip install` puts in site-packages.
exclude = ["src/arkova/agents.md"]

[tool.hatch.build.targets.wheel.force-include]
"src/arkova/py.typed" = "arkova/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
